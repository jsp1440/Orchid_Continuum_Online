<!DOCTYPE html>
<!-- 
  📊 Widget Health Monitor (RESTRICTED)
  Self-contained embed for Neon One CMS
  Tracks uptime and performance - Admin only
-->
<div id="widget-health-widget" role="region" aria-label="Widget Health Monitor">
  <style>
    #widget-health-widget {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      background: #1e293b;
      border-radius: 12px;
      color: white;
    }
    #widget-health-widget h2 {
      margin: 0 0 20px 0;
      font-size: 26px;
    }
    #widget-health-widget .widget-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    #widget-health-widget .widget-card {
      background: #334155;
      padding: 16px;
      border-radius: 12px;
      border-left: 4px solid #64748b;
    }
    #widget-health-widget .widget-card.healthy {
      border-left-color: #10b981;
    }
    #widget-health-widget .widget-card.warning {
      border-left-color: #f59e0b;
    }
    #widget-health-widget .widget-card.error {
      border-left-color: #ef4444;
    }
    #widget-health-widget .widget-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    #widget-health-widget .health-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    #widget-health-widget .status-healthy {
      background: #065f46;
      color: #d1fae5;
    }
    #widget-health-widget .status-warning {
      background: #78350f;
      color: #fef3c7;
    }
    #widget-health-widget .metric {
      margin: 8px 0;
      font-size: 14px;
      color: #cbd5e1;
    }
    #widget-health-widget .auth-warning {
      background: #fef2f2;
      color: #991b1b;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
  </style>

  <h2>📊 Widget Health Monitor</h2>
  <div id="health-content"></div>
</div>

<script>
(function() {
  'use strict';
  
  // ============================================================================
  // CONFIG - CHANGE ME
  // ============================================================================
  const CONFIG = {
    BASE_URL: 'https://your-orchid-app.onrender.com',  // CHANGE ME
  };
  // ============================================================================
  
  const contentDiv = document.getElementById('health-content');
  
  async function loadWidgetHealth() {
    try {
      const response = await fetch(`${CONFIG.BASE_URL}/api/widgets/health`, {
        credentials: 'include'
      });
      
      if (!response.ok) {
        throw new Error('Unauthorized');
      }
      
      const data = await response.json();
      renderHealth(data);
    } catch (error) {
      contentDiv.innerHTML = `<div class="auth-warning">
        🔒 Admin access required<br><br>
        This monitor is restricted to Board members.
      </div>`;
    }
  }
  
  function renderHealth(data) {
    const widgets = data.widgets || [
      { name: 'Orchid of the Day', status: 'healthy', uptime: 99.9, requests: 1234 },
      { name: 'Taxonomy Browser', status: 'healthy', uptime: 99.8, requests: 856 },
      { name: 'GBIF Explorer', status: 'healthy', uptime: 99.5, requests: 542 },
      { name: 'Philosophy Quiz', status: 'healthy', uptime: 100, requests: 678 },
      { name: 'Bingo', status: 'healthy', uptime: 99.9, requests: 432 },
      { name: 'My Collection', status: 'healthy', uptime: 98.5, requests: 345 }
    ];
    
    let html = '<div class="widget-grid">';
    
    widgets.forEach(widget => {
      const cardClass = widget.status === 'healthy' ? 'healthy' : 
                       widget.status === 'warning' ? 'warning' : 'error';
      const statusClass = widget.status === 'healthy' ? 'status-healthy' : 'status-warning';
      
      html += `<div class="widget-card ${cardClass}">
        <div class="widget-name">${widget.name}</div>
        <span class="${statusClass}">${widget.status.toUpperCase()}</span>
        <div class="metric">⏱️ Uptime: ${widget.uptime}%</div>
        <div class="metric">📊 Requests: ${widget.requests.toLocaleString()}/day</div>
      </div>`;
    });
    
    html += '</div>';
    
    contentDiv.innerHTML = html;
  }
  
  loadWidgetHealth();
  
  // Auto-refresh every 30 seconds
  setInterval(loadWidgetHealth, 30000);
})();
</script>
