<!DOCTYPE html>
<!-- 
  🌸 Orchid Taxonomy Browser Widget
  Self-contained embed for Neon One CMS
  Browse 35,000+ orchid taxonomy records
-->
<div id="taxonomy-browser-widget" role="region" aria-label="Orchid Taxonomy Browser">
  <style>
    #taxonomy-browser-widget {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #f7fafc;
      border-radius: 12px;
    }
    #taxonomy-browser-widget h2 {
      font-size: 26px;
      margin: 0 0 20px 0;
      color: #2d3748;
    }
    #taxonomy-browser-widget .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    #taxonomy-browser-widget input, #taxonomy-browser-widget select {
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      flex: 1;
      min-width: 200px;
    }
    #taxonomy-browser-widget button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    #taxonomy-browser-widget button:hover {
      background: #5568d3;
    }
    #taxonomy-browser-widget .results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    #taxonomy-browser-widget .result-card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      border-left: 4px solid #667eea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    #taxonomy-browser-widget .result-card h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-style: italic;
      color: #2d3748;
    }
    #taxonomy-browser-widget .result-card p {
      margin: 4px 0;
      font-size: 14px;
      color: #718096;
    }
    #taxonomy-browser-widget .pagination {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }
    #taxonomy-browser-widget .page-info {
      padding: 12px;
      color: #718096;
    }
    #taxonomy-browser-widget .banner {
      background: #fff3cd;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      color: #856404;
    }
  </style>

  <h2>🌸 Orchid Taxonomy Browser</h2>
  
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Search by name..." aria-label="Search orchids">
    <select id="genus-select" aria-label="Filter by genus">
      <option value="">All Genera</option>
    </select>
    <button onclick="window.searchTaxonomy()" aria-label="Search">🔍 Search</button>
  </div>
  
  <div id="taxonomy-results"></div>
</div>

<script>
(function() {
  'use strict';
  
  // ============================================================================
  // CONFIG - CHANGE ME
  // ============================================================================
  const CONFIG = {
    BASE_URL: 'https://your-orchid-app.onrender.com',  // CHANGE ME
  };
  // ============================================================================
  
  const resultsDiv = document.getElementById('taxonomy-results');
  const searchInput = document.getElementById('search-input');
  const genusSelect = document.getElementById('genus-select');
  let currentPage = 1;
  const pageSize = 12;
  
  async function loadGenera() {
    try {
      const response = await fetch(`${CONFIG.BASE_URL}/api/taxonomy/genera`, {
        headers: { 'Accept': 'application/json' }
      });
      if (response.ok) {
        const genera = await response.json();
        genera.forEach(genus => {
          const option = document.createElement('option');
          option.value = genus;
          option.textContent = genus;
          genusSelect.appendChild(option);
        });
      }
    } catch (e) {
      // Silently fail - genus filter is optional
    }
  }
  
  async function searchTaxonomy(page = 1) {
    const query = searchInput.value.trim();
    const genus = genusSelect.value;
    currentPage = page;
    
    resultsDiv.innerHTML = '<div style="text-align:center;padding:40px;color:#718096;">🔍 Searching...</div>';
    
    try {
      const params = new URLSearchParams({
        q: query,
        genus: genus,
        page: page.toString(),
        limit: pageSize.toString()
      });
      
      const response = await fetch(`${CONFIG.BASE_URL}/api/taxonomy/search?${params}`, {
        headers: { 'Accept': 'application/json' }
      });
      
      if (!response.ok) {
        throw new Error('API unavailable');
      }
      
      const data = await response.json();
      renderResults(data);
    } catch (error) {
      resultsDiv.innerHTML = `<div class="banner">
        ⚠️ Unable to connect to taxonomy database. 
        <a href="${CONFIG.BASE_URL}/search" target="_blank">Try the full browser →</a>
      </div>`;
    }
  }
  
  function renderResults(data) {
    const results = data.results || data || [];
    const total = data.total || results.length;
    
    if (results.length === 0) {
      resultsDiv.innerHTML = '<div style="text-align:center;padding:40px;color:#718096;">No orchids found. Try a different search.</div>';
      return;
    }
    
    let html = '<div class="results">';
    results.forEach(orchid => {
      html += `<div class="result-card">
        <h3>${orchid.scientific_name || (orchid.genus + ' ' + orchid.species)}</h3>
        ${orchid.author ? `<p><strong>Author:</strong> ${orchid.author}</p>` : ''}
        ${orchid.genus ? `<p><strong>Genus:</strong> ${orchid.genus}</p>` : ''}
        ${orchid.distribution ? `<p><strong>Distribution:</strong> ${orchid.distribution}</p>` : ''}
      </div>`;
    });
    html += '</div>';
    
    // Pagination
    const totalPages = Math.ceil(total / pageSize);
    if (totalPages > 1) {
      html += '<div class="pagination">';
      if (currentPage > 1) {
        html += `<button onclick="window.searchTaxonomy(${currentPage - 1})">← Previous</button>`;
      }
      html += `<span class="page-info">Page ${currentPage} of ${totalPages}</span>`;
      if (currentPage < totalPages) {
        html += `<button onclick="window.searchTaxonomy(${currentPage + 1})">Next →</button>`;
      }
      html += '</div>';
    }
    
    resultsDiv.innerHTML = html;
  }
  
  // Allow Enter key to search
  searchInput.addEventListener('keyup', function(event) {
    if (event.key === 'Enter') {
      searchTaxonomy();
    }
  });
  
  window.searchTaxonomy = searchTaxonomy;
  
  // Initialize
  loadGenera();
  searchTaxonomy(); // Load initial results
})();
</script>
