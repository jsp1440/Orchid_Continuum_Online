<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloomBuilder - Select Your Images</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a0e2e 0%, #2d1f3f 100%);
            color: #f5f3f8;
            font-family: 'Inter', sans-serif;
        }
        
        .gallery-stage {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3rem 1rem;
        }
        
        .stage-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .stage-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #e91e63;
            margin-bottom: 1rem;
        }
        
        .stage-subtitle {
            font-size: 1.2rem;
            color: #b8a5d3;
        }
        
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .image-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
        }
        
        .image-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(233, 30, 99, 0.3);
            border-color: #e91e63;
        }
        
        .image-card.selected {
            border-color: #4caf50;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.6);
        }
        
        .image-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }
        
        .image-card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 60%, transparent 100%);
            padding: 1.5rem 1rem;
            color: white;
            transform: translateY(60%);
            transition: transform 0.3s ease;
        }
        
        .image-card:hover .image-card-overlay {
            transform: translateY(0);
        }
        
        .image-source {
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .image-metadata {
            font-size: 0.75rem;
            opacity: 0.8;
            line-height: 1.4;
        }
        
        .image-date {
            color: #e91e63;
            font-weight: 500;
        }
        
        .image-contributors {
            font-style: italic;
            margin-top: 0.3rem;
        }
        
        .selected-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #4caf50;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            display: none;
        }
        
        .image-card.selected .selected-badge {
            display: block;
        }
        
        .continue-btn {
            background: linear-gradient(135deg, #e91e63 0%, #9c27b0 100%);
            border: none;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            color: white;
            margin: 3rem auto;
            display: block;
            transition: all 0.3s ease;
        }
        
        .continue-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.5);
        }
        
        .continue-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .progress-indicator {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 1rem 2rem;
            border-radius: 50px;
            display: flex;
            gap: 1rem;
            z-index: 1000;
        }
        
        .progress-step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        
        .progress-step.active {
            background: #e91e63;
        }
        
        .progress-step.complete {
            background: #4caf50;
        }
    </style>
</head>
<body>
    <div class="progress-indicator">
        <div class="progress-step active" id="step1">1</div>
        <div class="progress-step" id="step2">2</div>
        <div class="progress-step" id="step3">3</div>
    </div>

    <!-- Stage 1: Herbarium Specimens -->
    <div class="gallery-stage" id="stage-herbarium">
        <div class="stage-header">
            <h1 class="stage-title">Choose Your Herbarium Specimen</h1>
            <p class="stage-subtitle">Select the pressed specimen that inspires you</p>
        </div>
        
        <div class="image-grid" id="herbarium-grid"></div>
        
        <button class="continue-btn" id="btn-herbarium" disabled onclick="nextStage('plates')">
            Continue to Botanical Plates →
        </button>
    </div>

    <!-- Stage 2: Botanical Plates -->
    <div class="gallery-stage" id="stage-plates" style="display:none;">
        <div class="stage-header">
            <h1 class="stage-title">Choose Your Botanical Plate</h1>
            <p class="stage-subtitle">Select a historical botanical illustration</p>
        </div>
        
        <div class="image-grid" id="plates-grid"></div>
        
        <button class="continue-btn" id="btn-plates" disabled onclick="nextStage('photos')">
            Continue to Modern Photos →
        </button>
    </div>

    <!-- Stage 3: Modern Photos -->
    <div class="gallery-stage" id="stage-photos" style="display:none;">
        <div class="stage-header">
            <h1 class="stage-title">Choose Your Photograph</h1>
            <p class="stage-subtitle">Select a modern orchid photograph</p>
        </div>
        
        <div class="image-grid" id="photos-grid"></div>
        
        <button class="continue-btn" id="btn-photos" disabled onclick="goToWorkbench()">
            Enter BloomBuilder Workbench →
        </button>
    </div>

    <script>
        const selections = {
            herbarium: null,
            plate: null,
            photo: null,
            species_id: {{ species_id }}
        };

        // Load images for each stage
        async function loadImages() {
            const response = await fetch(`/bloombuilder/api/species/${selections.species_id}`);
            const data = await response.json();
            
            // Populate herbarium grid
            populateGrid('herbarium-grid', data.images.herbarium, 'herbarium');
            
            // Populate plates grid
            populateGrid('plates-grid', data.images.botanical_plates, 'plates');
            
            // Populate photos grid
            populateGrid('photos-grid', data.images.photos, 'photos');
        }

        function populateGrid(gridId, images, type) {
            const grid = document.getElementById(gridId);
            
            images.forEach((img, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.onclick = () => selectImage(type, img, card);
                
                // Build metadata caption
                const date = img.date || img.collected_date || 'Date unknown';
                const location = img.location || img.locality || '';
                const contributors = img.contributors || img.collector || '';
                
                card.innerHTML = `
                    <img src="${img.url}" alt="${img.source}">
                    <div class="image-card-overlay">
                        <div class="image-source">${img.source}</div>
                        <div class="image-metadata">
                            <div class="image-date">📅 ${date}</div>
                            ${location ? `<div>📍 ${location}</div>` : ''}
                            ${contributors ? `<div class="image-contributors">👤 ${contributors}</div>` : ''}
                        </div>
                    </div>
                    <div class="selected-badge">✓ Selected</div>
                `;
                
                grid.appendChild(card);
            });
        }

        function selectImage(type, imageData, cardElement) {
            // Remove previous selection
            const grid = cardElement.parentElement;
            grid.querySelectorAll('.image-card').forEach(c => c.classList.remove('selected'));
            
            // Mark this as selected
            cardElement.classList.add('selected');
            selections[type] = imageData;
            
            // Enable continue button
            if (type === 'herbarium') {
                document.getElementById('btn-herbarium').disabled = false;
            } else if (type === 'plates') {
                document.getElementById('btn-plates').disabled = false;
            } else if (type === 'photos') {
                document.getElementById('btn-photos').disabled = false;
            }
        }

        function nextStage(stageName) {
            // Hide current stage
            document.querySelectorAll('.gallery-stage').forEach(s => s.style.display = 'none');
            
            // Show next stage
            document.getElementById(`stage-${stageName}`).style.display = 'flex';
            
            // Update progress indicator
            if (stageName === 'plates') {
                document.getElementById('step1').classList.add('complete');
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
            } else if (stageName === 'photos') {
                document.getElementById('step2').classList.add('complete');
                document.getElementById('step2').classList.remove('active');
                document.getElementById('step3').classList.add('active');
            }
            
            // Smooth scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goToWorkbench() {
            // Save selections to session
            sessionStorage.setItem('bloombuilder_selections', JSON.stringify(selections));
            
            // Redirect to workbench with animation
            document.getElementById('step3').classList.add('complete');
            
            setTimeout(() => {
                window.location.href = `/bloombuilder/workbench/${selections.species_id}`;
            }, 500);
        }

        // Initialize
        loadImages();
    </script>
</body>
</html>
