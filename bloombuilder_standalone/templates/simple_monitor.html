<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor - The Orchid Continuum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .monitor-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        .stat-card {
            background: #16213e;
            border-radius: 15px;
            padding: 25px;
            margin: 15px 0;
            border-left: 4px solid #0f3460;
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-number {
            font-size: 48px;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat-label {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff00;
            display: inline-block;
            animation: blink 2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .activity-item {
            background: #16213e;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 3px solid #00d4ff;
        }
        .provider-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #0f3460;
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="monitor-container">
        <h1 class="text-center mb-4">
            <span class="status-dot"></span> System Monitor
        </h1>
        <p class="text-center text-muted">Real-time AI Processing & Database Statistics</p>
        
        <div class="row mt-5">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-label">Total Orchids</div>
                    <div class="stat-number" id="total-orchids">-</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-label">Taxonomy Entries</div>
                    <div class="stat-number" id="total-taxonomy">-</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-label">AI Analyses</div>
                    <div class="stat-number" id="total-analyses">-</div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="stat-card">
                    <h4>AI Provider Usage</h4>
                    <div id="provider-stats" class="mt-3"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="stat-card">
                    <h4>Recent Activity (Last 24h)</h4>
                    <div class="stat-number" id="recent-count">-</div>
                    <div class="stat-label">Analyses completed</div>
                </div>
            </div>
        </div>
        
        <div class="mt-5">
            <h3>Latest AI Processing</h3>
            <div id="recent-activity"></div>
        </div>
        
        <div class="text-center mt-4">
            <p class="text-muted">Last updated: <span id="last-update">-</span></p>
            <p id="system-status" class="text-success"></p>
        </div>
    </div>

    <script>
        async function updateStats() {
            try {
                const response = await fetch('/api/monitor/stats');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('total-orchids').innerText = data.database.total_orchids.toLocaleString();
                    document.getElementById('total-taxonomy').innerText = data.database.total_taxonomy.toLocaleString();
                    document.getElementById('total-analyses').innerText = data.database.total_ai_analyses.toLocaleString();
                    document.getElementById('recent-count').innerText = data.activity.last_24h_analyses;
                    document.getElementById('system-status').innerText = data.status;
                    document.getElementById('last-update').innerText = new Date(data.timestamp).toLocaleTimeString();
                    
                    // Provider stats
                    const providerDiv = document.getElementById('provider-stats');
                    providerDiv.innerHTML = Object.entries(data.ai_providers).map(([provider, count]) =>
                        `<div class="mt-2">
                            <span class="provider-badge">${provider || 'Unknown'}</span>
                            <span class="ms-2">${count} analyses</span>
                        </div>`
                    ).join('');
                }
            } catch (error) {
                console.error('Stats update error:', error);
                document.getElementById('system-status').innerText = 'Error updating stats';
            }
        }
        
        async function updateActivity() {
            try {
                const response = await fetch('/api/monitor/recent-activity');
                const data = await response.json();
                
                if (data.success) {
                    const activityDiv = document.getElementById('recent-activity');
                    activityDiv.innerHTML = data.activities.map(a =>
                        `<div class="activity-item">
                            <strong>${a.species}</strong>
                            <span class="provider-badge ms-2">${a.provider}</span>
                            <span class="text-muted float-end">
                                ${a.processing_time ? a.processing_time.toFixed(2) + 's' : '-'}
                            </span>
                        </div>`
                    ).join('');
                }
            } catch (error) {
                console.error('Activity update error:', error);
            }
        }
        
        // Initial load
        updateStats();
        updateActivity();
        
        // Auto-refresh every 5 seconds
        setInterval(() => {
            updateStats();
            updateActivity();
        }, 5000);
    </script>
</body>
</html>
