<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %} - Orchid Continuum</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    
    <style>
        :root {
            --orchid-purple: #9b59b6;
            --orchid-pink: #e91e63;
            --orchid-green: #27ae60;
        }
        
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background: linear-gradient(135deg, var(--orchid-purple), var(--orchid-pink));
        }
        
        .card {
            background-color: #2a2a2a;
            border-color: #3a3a3a;
            color: #e0e0e0;
        }
        
        .table {
            color: #e0e0e0;
        }
        
        .table-hover tbody tr:hover {
            background-color: #3a3a3a;
        }
        
        .btn-primary {
            background-color: var(--orchid-purple);
            border-color: var(--orchid-purple);
        }
        
        .btn-primary:hover {
            background-color: #8e44ad;
            border-color: #8e44ad;
        }
        
        .progress-bar {
            background-color: var(--orchid-purple);
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i data-feather="shield"></i> Orchid Continuum Admin
            </span>
            <div>
                <a href="/" class="btn btn-sm btn-outline-light me-2">
                    <i data-feather="home"></i> Main Site
                </a>
                <a href="/admin" class="btn btn-sm btn-outline-light">
                    <i data-feather="grid"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        feather.replace();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
