<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Upload Widget</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body { 
            background: transparent; 
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .upload-widget {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .upload-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .upload-header h3 {
            color: white;
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }
        .drop-zone {
            background: rgba(255,255,255,0.95);
            border: 3px dashed #f5576c;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .drop-zone:hover {
            background: rgba(255,255,255,1);
            border-color: #f093fb;
        }
        .drop-zone.dragover {
            background: rgba(245,87,108,0.1);
            transform: scale(1.02);
        }
        .upload-icon {
            color: #f5576c;
            margin-bottom: 15px;
        }
        .preview-area {
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .preview-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .validation-results {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .validation-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .validation-item:last-child {
            border-bottom: none;
        }
        .validation-icon {
            margin-right: 10px;
        }
        .validation-pass {
            color: #10b981;
        }
        .validation-fail {
            color: #ef4444;
        }
        .metadata-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .metadata-card {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
        }
        .metadata-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .metadata-value {
            font-weight: 600;
            color: #333;
        }
        .ai-analysis {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d4aa, #6B3FA0);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,212,170,0.4);
        }
    </style>
</head>
<body>
    <div class="upload-widget">
        <div class="upload-header">
            <h3><i data-feather="upload-cloud"></i> Photo Upload & Validation</h3>
            <p style="color: rgba(255,255,255,0.9); margin-top: 10px;">Upload orchid photos for AI-powered validation</p>
        </div>
        
        <div class="drop-zone" id="dropZone">
            <i data-feather="image" class="upload-icon" style="width: 64px; height: 64px;"></i>
            <h4 style="color: #333; margin: 10px 0;">Drop your photo here</h4>
            <p style="color: #666; margin: 0;">or click to browse</p>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>
        
        <div class="preview-area" id="previewArea">
            <img id="previewImage" class="preview-image" alt="Preview">
            
            <div class="validation-results">
                <h5 style="margin: 0 0 15px 0; color: #333;">Validation Results</h5>
                <div id="validationList"></div>
            </div>
            
            <div class="ai-analysis" id="aiAnalysis" style="display: none;">
                <h6 style="margin: 0 0 10px 0;">🤖 AI Analysis</h6>
                <p id="aiDescription" style="margin: 0;"></p>
            </div>
            
            <div class="metadata-grid" id="metadataGrid"></div>
            
            <button class="submit-btn" onclick="submitPhoto()">
                <i data-feather="check"></i> Approve & Upload
            </button>
        </div>
    </div>

    <script>
        feather.replace();
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const previewImage = document.getElementById('previewImage');
        
        let currentFile = null;
        
        // Click to upload
        dropZone.addEventListener('click', () => fileInput.click());
        
        // Drag and drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file');
                return;
            }
            
            currentFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewArea.style.display = 'block';
                validateImage(file);
            };
            reader.readAsDataURL(file);
        }
        
        async function validateImage(file) {
            const validations = [
                { check: 'File type', pass: file.type.startsWith('image/'), message: 'Valid image format' },
                { check: 'File size', pass: file.size < 10 * 1024 * 1024, message: file.size < 10 * 1024 * 1024 ? 'Size OK' : 'File too large (max 10MB)' },
                { check: 'Dimensions', pass: true, message: 'Checking...' }
            ];
            
            const img = new Image();
            img.onload = () => {
                validations[2].pass = img.width >= 400 && img.height >= 400;
                validations[2].message = validations[2].pass ? `${img.width}x${img.height} px` : 'Too small (min 400x400)';
                displayValidations(validations);
                
                // Show metadata
                displayMetadata(file, img);
                
                // Simulate AI analysis
                setTimeout(() => {
                    const aiAnalysis = document.getElementById('aiAnalysis');
                    const aiDescription = document.getElementById('aiDescription');
                    aiDescription.textContent = 'Detected: Orchid flower, possibly Phalaenopsis genus. High quality image with good lighting. Suitable for database entry.';
                    aiAnalysis.style.display = 'block';
                }, 1000);
            };
            img.src = previewImage.src;
            
            displayValidations(validations);
        }
        
        function displayValidations(validations) {
            const container = document.getElementById('validationList');
            container.innerHTML = validations.map(v => `
                <div class="validation-item">
                    <i data-feather="${v.pass ? 'check-circle' : 'x-circle'}" 
                       class="validation-icon ${v.pass ? 'validation-pass' : 'validation-fail'}" 
                       style="width: 20px; height: 20px;"></i>
                    <div>
                        <strong>${v.check}:</strong> ${v.message}
                    </div>
                </div>
            `).join('');
            feather.replace();
        }
        
        function displayMetadata(file, img) {
            const metadata = [
                { label: 'File Name', value: file.name },
                { label: 'File Size', value: (file.size / 1024).toFixed(2) + ' KB' },
                { label: 'Dimensions', value: `${img.width} x ${img.height} px` },
                { label: 'Format', value: file.type.split('/')[1].toUpperCase() }
            ];
            
            const container = document.getElementById('metadataGrid');
            container.innerHTML = metadata.map(m => `
                <div class="metadata-card">
                    <div class="metadata-label">${m.label}</div>
                    <div class="metadata-value">${m.value}</div>
                </div>
            `).join('');
        }
        
        async function submitPhoto() {
            if (!currentFile) return;
            
            const formData = new FormData();
            formData.append('photo', currentFile);
            
            try {
                const response = await fetch('/api/upload-photo', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    alert('Photo uploaded successfully!');
                    location.reload();
                } else {
                    alert('Upload failed. Please try again.');
                }
            } catch (error) {
                alert('Upload error: ' + error.message);
            }
        }
    </script>
</body>
</html>
