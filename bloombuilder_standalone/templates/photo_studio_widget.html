<!-- Orchid Photo Studio Widget - Migrated from Famous AI -->
<!-- Edit, style, and share orchid photos -->

<style>
    .photo-studio-container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem;
    }
    
    .studio-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .studio-header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
    }
    
    .studio-subtitle {
        color: rgba(255, 255, 255, 0.7);
        font-size: 1.1rem;
    }
    
    .studio-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 2rem;
        margin-top: 2rem;
    }
    
    /* Upload Section */
    .upload-section {
        background: rgba(255, 255, 255, 0.05);
        border: 2px dashed rgba(139, 92, 246, 0.3);
        border-radius: 12px;
        padding: 3rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .upload-section:hover {
        border-color: rgba(139, 92, 246, 0.6);
        background: rgba(255, 255, 255, 0.08);
    }
    
    .upload-section.has-image {
        padding: 0;
        border-style: solid;
        cursor: default;
    }
    
    .upload-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
    }
    
    .upload-text {
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 1rem;
    }
    
    #photoPreview {
        max-width: 100%;
        border-radius: 8px;
        display: none;
    }
    
    #photoPreview.visible {
        display: block;
    }
    
    /* Controls Section */
    .controls-section {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 1.5rem;
    }
    
    .control-group {
        margin-bottom: 1.5rem;
    }
    
    .control-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #a78bfa;
    }
    
    .slider-container {
        display: flex;
        align-items: center;
        gap: 1rem;
    }
    
    .slider {
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        outline: none;
        -webkit-appearance: none;
    }
    
    .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
        cursor: pointer;
    }
    
    .slider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
        cursor: pointer;
        border: none;
    }
    
    .slider-value {
        min-width: 40px;
        text-align: right;
        color: rgba(255, 255, 255, 0.7);
    }
    
    /* Preset Buttons */
    .preset-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
    }
    
    .btn-preset {
        padding: 0.75rem;
        background: rgba(139, 92, 246, 0.1);
        border: 1px solid rgba(139, 92, 246, 0.3);
        border-radius: 8px;
        color: #a78bfa;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 0.9rem;
    }
    
    .btn-preset:hover {
        background: rgba(139, 92, 246, 0.2);
        border-color: rgba(139, 92, 246, 0.5);
    }
    
    /* Action Buttons */
    .action-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-top: 2rem;
    }
    
    .btn-action {
        padding: 1rem;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
        color: white;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
    }
    
    .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.15);
    }
    
    .btn-reset {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }
    
    .btn-reset:hover {
        background: rgba(239, 68, 68, 0.2);
    }
    
    @media (max-width: 768px) {
        .studio-grid {
            grid-template-columns: 1fr;
        }
        .preset-buttons {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="photo-studio-container">
    <div class="studio-header">
        <h1>🌺 Orchid Photo Studio</h1>
        <p class="studio-subtitle">Edit, style, and share your orchid photos — then submit them to the FCOS Gallery</p>
    </div>
    
    <div class="studio-grid">
        <!-- Photo Canvas -->
        <div>
            <h3 style="margin-bottom: 1rem;">📸 Upload Your Orchid Photo</h3>
            <div class="upload-section" id="uploadSection">
                <div id="uploadPrompt">
                    <div class="upload-icon">📷</div>
                    <p class="upload-text">Drag & drop your orchid photo here</p>
                    <input type="file" id="photoInput" accept="image/*" style="display: none;">
                    <button class="btn-action btn-primary" onclick="document.getElementById('photoInput').click()">Choose File</button>
                </div>
                <canvas id="photoCanvas" style="display: none; max-width: 100%; border-radius: 8px;"></canvas>
            </div>
        </div>
        
        <!-- Controls -->
        <div>
            <div class="controls-section">
                <h3 style="margin-bottom: 1.5rem;">🎨 Photo Adjustments</h3>
                
                <div class="control-group">
                    <label class="control-label">Brightness</label>
                    <div class="slider-container">
                        <input type="range" id="brightnessSlider" class="slider" min="50" max="150" value="100">
                        <span class="slider-value" id="brightnessValue">100%</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Contrast</label>
                    <div class="slider-container">
                        <input type="range" id="contrastSlider" class="slider" min="50" max="150" value="100">
                        <span class="slider-value" id="contrastValue">100%</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Saturation</label>
                    <div class="slider-container">
                        <input type="range" id="saturationSlider" class="slider" min="0" max="200" value="100">
                        <span class="slider-value" id="saturationValue">100%</span>
                    </div>
                </div>
                
                <h4 style="margin: 1.5rem 0 1rem; color: #a78bfa;">✨ Orchid Presets</h4>
                <div class="preset-buttons">
                    <button class="btn-preset" onclick="applyPreset('petalDetail')">🌸 Petal Detail</button>
                    <button class="btn-preset" onclick="applyPreset('trueColor')">🌿 True Color</button>
                    <button class="btn-preset" onclick="applyPreset('brightBloom')">☀️ Bright Bloom</button>
                    <button class="btn-preset" onclick="applyPreset('greenhouse')">🏠 Greenhouse</button>
                </div>
                
                <button class="btn-action btn-reset" onclick="resetAdjustments()">Reset All</button>
            </div>
        </div>
    </div>
    
    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="btn-action btn-primary" onclick="savePhoto()">💾 Save to Collection</button>
        <button class="btn-action btn-primary" onclick="submitToGallery()">📸 Submit to FCOS Gallery</button>
        <button class="btn-action btn-secondary" onclick="sharePhoto()">📱 Share</button>
        <button class="btn-action btn-secondary" onclick="downloadPhoto()">⬇️ Download</button>
    </div>
</div>

<script>
let canvas, ctx, originalImage;
let brightness = 100, contrast = 100, saturation = 100;

const photoInput = document.getElementById('photoInput');
const uploadSection = document.getElementById('uploadSection');
const uploadPrompt = document.getElementById('uploadPrompt');
canvas = document.getElementById('photoCanvas');
ctx = canvas.getContext('2d');

// File upload handling
photoInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                originalImage = img;
                canvas.width = img.width;
                canvas.height = img.height;
                uploadPrompt.style.display = 'none';
                canvas.style.display = 'block';
                uploadSection.classList.add('has-image');
                applyFilters();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    }
});

// Drag and drop
uploadSection.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadSection.style.borderColor = 'rgba(139, 92, 246, 0.8)';
});

uploadSection.addEventListener('dragleave', () => {
    uploadSection.style.borderColor = 'rgba(139, 92, 246, 0.3)';
});

uploadSection.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadSection.style.borderColor = 'rgba(139, 92, 246, 0.3)';
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
        photoInput.files = e.dataTransfer.files;
        photoInput.dispatchEvent(new Event('change'));
    }
});

// Sliders
document.getElementById('brightnessSlider').addEventListener('input', function(e) {
    brightness = parseInt(e.target.value);
    document.getElementById('brightnessValue').textContent = brightness + '%';
    applyFilters();
});

document.getElementById('contrastSlider').addEventListener('input', function(e) {
    contrast = parseInt(e.target.value);
    document.getElementById('contrastValue').textContent = contrast + '%';
    applyFilters();
});

document.getElementById('saturationSlider').addEventListener('input', function(e) {
    saturation = parseInt(e.target.value);
    document.getElementById('saturationValue').textContent = saturation + '%';
    applyFilters();
});

// Apply filters to canvas
function applyFilters() {
    if (!originalImage) return;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%)`;
    ctx.drawImage(originalImage, 0, 0);
}

// Presets
function applyPreset(preset) {
    switch(preset) {
        case 'petalDetail':
            brightness = 110;
            contrast = 120;
            saturation = 90;
            break;
        case 'trueColor':
            brightness = 100;
            contrast = 100;
            saturation = 100;
            break;
        case 'brightBloom':
            brightness = 130;
            contrast = 110;
            saturation = 120;
            break;
        case 'greenhouse':
            brightness = 95;
            contrast = 105;
            saturation = 85;
            break;
    }
    
    document.getElementById('brightnessSlider').value = brightness;
    document.getElementById('contrastSlider').value = contrast;
    document.getElementById('saturationSlider').value = saturation;
    document.getElementById('brightnessValue').textContent = brightness + '%';
    document.getElementById('contrastValue').textContent = contrast + '%';
    document.getElementById('saturationValue').textContent = saturation + '%';
    
    applyFilters();
}

function resetAdjustments() {
    applyPreset('trueColor');
}

function savePhoto() {
    if (!originalImage) {
        alert('Please upload a photo first!');
        return;
    }
    alert('Photo saved to your collection! 💾');
}

function submitToGallery() {
    if (!originalImage) {
        alert('Please upload a photo first!');
        return;
    }
    alert('Photo submitted to FCOS Gallery! 🌸 Awaiting moderation.');
}

function sharePhoto() {
    if (!originalImage) {
        alert('Please upload a photo first!');
        return;
    }
    alert('Share functionality coming soon! 📱');
}

function downloadPhoto() {
    if (!originalImage) {
        alert('Please upload a photo first!');
        return;
    }
    const link = document.createElement('a');
    link.download = 'orchid-photo-edited.png';
    link.href = canvas.toDataURL();
    link.click();
}
</script>
