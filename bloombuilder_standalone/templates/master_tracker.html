<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Project Tracker - The Orchid Continuum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .tracker-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 20px;
        }
        .project-card {
            background: #161b22;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            border: 1px solid #30363d;
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-complete { background: #238636; color: white; }
        .status-testing { background: #1f6feb; color: white; }
        .status-in-progress { background: #d29922; color: white; }
        .status-pending { background: #8b949e; color: white; }
        .status-unknown { background: #8b949e; color: white; }
        .status-working { background: #238636; color: white; }
        .status-available { background: #1f6feb; color: white; }
        .status-quota-issue { background: #da3633; color: white; }
        .feature-item {
            padding: 12px;
            margin: 8px 0;
            background: #0d1117;
            border-radius: 6px;
            border-left: 3px solid #30363d;
        }
        .owner-tag {
            background: #21262d;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #58a6ff;
        }
        .summary-box {
            background: #21262d;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .summary-stat {
            font-size: 32px;
            font-weight: bold;
            color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="tracker-container">
        <h1 class="text-center mb-2">📋 Master Project Tracker</h1>
        <p class="text-center text-muted">Complete status of all Orchid Continuum features</p>
        
        <div class="summary-box">
            <div class="row text-center">
                <div class="col-md-4">
                    <div class="summary-stat" id="total-projects">-</div>
                    <div class="text-muted">Total Projects</div>
                </div>
                <div class="col-md-4">
                    <div class="summary-stat text-success" id="complete-count">-</div>
                    <div class="text-muted">Complete</div>
                </div>
                <div class="col-md-4">
                    <div class="summary-stat text-warning" id="in-progress-count">-</div>
                    <div class="text-muted">In Progress</div>
                </div>
            </div>
        </div>
        
        <div id="projects-container"></div>
        
        <div class="text-center mt-5">
            <p class="text-muted">Last updated: <span id="last-update">-</span></p>
        </div>
    </div>

    <script>
        async function loadProjectStatus() {
            try {
                const response = await fetch('/api/tracker/status');
                const data = await response.json();
                
                if (data.success) {
                    // Update summary
                    document.getElementById('total-projects').innerText = data.summary.total_projects;
                    document.getElementById('complete-count').innerText = data.summary.complete;
                    document.getElementById('in-progress-count').innerText = data.summary.in_progress;
                    document.getElementById('last-update').innerText = new Date(data.timestamp).toLocaleTimeString();
                    
                    // Render projects
                    const container = document.getElementById('projects-container');
                    container.innerHTML = Object.values(data.projects).map(project => `
                        <div class="project-card">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div>
                                    <h3>${project.name}</h3>
                                    <span class="owner-tag">👤 ${project.owner}</span>
                                </div>
                                <span class="status-badge status-${project.status}">${project.status.replace('_', ' ')}</span>
                            </div>
                            
                            ${project.features ? `
                                <div class="mt-3">
                                    <strong>Features:</strong>
                                    ${project.features.map(f => `
                                        <div class="feature-item">
                                            <div class="d-flex justify-content-between">
                                                <span>${f.name}</span>
                                                <div>
                                                    <span class="status-badge status-${f.status}">${f.status}</span>
                                                    ${f.cost ? `<span class="badge bg-info ms-2">${f.cost}</span>` : ''}
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                            
                            ${project.url ? `
                                <div class="mt-3">
                                    <a href="${project.url}" class="btn btn-primary btn-sm" target="_blank">
                                        View Widget →
                                    </a>
                                </div>
                            ` : ''}
                            
                            ${project.notes ? `
                                <div class="mt-3 text-muted">
                                    <small>📝 ${project.notes}</small>
                                </div>
                            ` : ''}
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Load error:', error);
            }
        }
        
        // Initial load
        loadProjectStatus();
        
        // Auto-refresh every 10 seconds
        setInterval(loadProjectStatus, 10000);
    </script>
</body>
</html>
