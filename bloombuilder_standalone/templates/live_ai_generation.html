<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live AI Generation - The Orchid Continuum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .widget-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            margin: 0 auto;
        }
        .step-item {
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            background: #f8f9fa;
            border-left: 4px solid #ccc;
            transition: all 0.3s;
        }
        .step-item.running {
            border-left-color: #ffc107;
            background: #fff8e1;
            animation: pulse 1.5s infinite;
        }
        .step-item.complete {
            border-left-color: #28a745;
            background: #d4edda;
        }
        .step-item.error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .analysis-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .total-cost {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="widget-container">
            <h1 class="text-center mb-4">🌸 Live AI Generation Widget</h1>
            <p class="text-center text-muted">Watch as AI analyzes orchids and generates illustrations in real-time!</p>
            
            <div class="row mt-5">
                <div class="col-md-8 mx-auto">
                    <div class="input-group mb-3">
                        <input type="text" id="species-search" class="form-control form-control-lg" 
                               placeholder="Search for an orchid species...">
                        <button class="btn btn-primary btn-lg" id="generate-btn">
                            Generate ✨
                        </button>
                    </div>
                    <div id="search-results" class="list-group mb-4" style="display:none;"></div>
                </div>
            </div>
            
            <div id="generation-progress" style="display:none;">
                <h3 class="mt-4">Generation Progress:</h3>
                <div id="steps-container"></div>
                
                <div id="results-section" style="display:none;" class="mt-4">
                    <h3>Results:</h3>
                    <div class="analysis-box" id="analysis-content"></div>
                    
                    <div class="text-center mt-4">
                        <h4>Total Cost: <span class="total-cost" id="total-cost">$0.0000</span></h4>
                        <p class="text-success">💰 Using FREE AI services!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedSpecies = '';
        
        document.getElementById('species-search').addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length < 3) {
                document.getElementById('search-results').style.display = 'none';
                return;
            }
            
            const response = await fetch(`/api/search-orchids?q=${query}`);
            const orchids = await response.json();
            
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = orchids.map(o => 
                `<button class="list-group-item list-group-item-action" onclick="selectOrchid('${o.name}')">
                    ${o.name}
                </button>`
            ).join('');
            resultsDiv.style.display = orchids.length > 0 ? 'block' : 'none';
        });
        
        function selectOrchid(name) {
            selectedSpecies = name;
            document.getElementById('species-search').value = name;
            document.getElementById('search-results').style.display = 'none';
        }
        
        document.getElementById('generate-btn').addEventListener('click', async () => {
            if (!selectedSpecies) {
                alert('Please select an orchid species first!');
                return;
            }
            
            document.getElementById('generation-progress').style.display = 'block';
            document.getElementById('steps-container').innerHTML = '';
            document.getElementById('results-section').style.display = 'none';
            
            try {
                const response = await fetch('/api/live-generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({species: selectedSpecies})
                });
                
                const data = await response.json();
                
                if (data.cached) {
                    alert(data.message);
                    showCachedResult(data.data);
                } else {
                    showGenerationSteps(data);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
        
        function showGenerationSteps(data) {
            const container = document.getElementById('steps-container');
            
            data.steps.forEach(step => {
                const stepDiv = document.createElement('div');
                stepDiv.className = `step-item ${step.status}`;
                stepDiv.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            ${step.status === 'running' ? '<span class="spinner"></span>' : ''}
                            <strong>Step ${step.step}:</strong> ${step.name}
                        </div>
                        <div>
                            ${step.time ? `<span class="badge bg-info">${step.time.toFixed(2)}s</span>` : ''}
                            ${step.cost ? `<span class="badge bg-success">${step.cost}</span>` : ''}
                            ${step.provider ? `<span class="badge bg-primary">${step.provider}</span>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(stepDiv);
            });
            
            if (data.analysis) {
                document.getElementById('analysis-content').innerText = data.analysis;
                document.getElementById('results-section').style.display = 'block';
                document.getElementById('total-cost').innerText = data.total_cost || '$0.0000';
            }
        }
        
        function showCachedResult(data) {
            document.getElementById('analysis-content').innerText = data.analysis;
            document.getElementById('results-section').style.display = 'block';
            document.getElementById('total-cost').innerText = '$0.0000 (Cached)';
        }
    </script>
</body>
</html>
