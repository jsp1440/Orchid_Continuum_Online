services:
  # Main Flask Web Application
  - type: web
    name: orchid-continuum
    env: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: bash render_init.sh && python create_database.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT main:app
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ORCHID_AI_ENABLED
        value: "false"
  
  # ============================================
  # FLUID MULTI-SOURCE HARVESTERS (NEW - v2.0)
  # Each harvester dynamically switches between:
  # GBIF, iNaturalist, iDigBio, ALA
  # Target: 500+ images/hour per worker
  # ============================================
  
  - type: worker
    name: fluid-harvester-1
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u workers/fluid_harvester.py
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: WORKER_ID
        value: "fluid-1"
  
  - type: worker
    name: fluid-harvester-2
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u workers/fluid_harvester.py
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: WORKER_ID
        value: "fluid-2"
  
  - type: worker
    name: fluid-harvester-3
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u workers/fluid_harvester.py
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: WORKER_ID
        value: "fluid-3"
  
  - type: worker
    name: fluid-harvester-4
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u workers/fluid_harvester.py
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: WORKER_ID
        value: "fluid-4"
  
  # ============================================
  # LEGACY WORKERS (can be disabled after testing fluid harvesters)
  # ============================================
  
  # Legacy GBIF Worker
  - type: worker
    name: orchid-gbif-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u workers/gbif_worker.py
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
  
  # EOL DATA PROCESSING - Run manually after deployment
  # The EOL worker has been replaced with a 3-step manual process:
  # 1. Download TraitBank: bash render_init.sh (auto-runs on first deploy)
  # 2. Process traits: python validation/process_eol_traits.py
  # 3. Link images to traits: python validation/link_eol_data.py
  # 4. Import to database: python validation/import_eol_to_db.py
  #
  # This approach matches 5.6M EOL images to 3M+ trait records using page_id
  # before importing to database, ensuring data integrity and relationships.