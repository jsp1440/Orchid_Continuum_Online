<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julius API Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <h1 class="mb-4">🧪 Julius API Test Page</h1>
        
        <div class="card bg-secondary mb-4">
            <div class="card-body">
                <h5>Your API Key</h5>
                <input type="text" class="form-control mb-3" id="apiKey" 
                       value="cdfgutre345ko98bhgfdxccvAwlkmnmkgeswdfbkoplhgb" 
                       placeholder="Paste your Julius API key">
                
                <button class="btn btn-primary me-2" onclick="testHealth()">Test Health</button>
                <button class="btn btn-success me-2" onclick="testGlossary()">Test Glossary</button>
                <button class="btn btn-info me-2" onclick="testKeys()">Test Keys</button>
                <button class="btn btn-warning" onclick="testStats()">Test Stats</button>
            </div>
        </div>

        <div class="card bg-secondary">
            <div class="card-body">
                <h5>Response:</h5>
                <pre id="result" class="bg-dark p-3 rounded" style="max-height: 500px; overflow-y: auto;">
Click a button above to test the API...
                </pre>
            </div>
        </div>

        <div class="alert alert-info mt-4">
            <strong>✅ How it works:</strong>
            <ul class="mb-0">
                <li>Each button tests a different Julius API endpoint</li>
                <li>The API key is automatically included in the request</li>
                <li>Results appear in the box above</li>
            </ul>
        </div>
    </div>

    <script>
        const BASE_URL = window.location.origin + '/api/julius';

        async function callAPI(endpoint, params = {}) {
            const apiKey = document.getElementById('apiKey').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.textContent = `⏳ Calling ${endpoint}...\n`;
            
            try {
                const queryString = new URLSearchParams(params).toString();
                const url = `${BASE_URL}${endpoint}${queryString ? '?' + queryString : ''}`;
                
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.textContent = `✅ SUCCESS (${response.status})\n\n` + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.textContent = `❌ ERROR (${response.status})\n\n` + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.textContent = `❌ NETWORK ERROR\n\n${error.message}`;
            }
        }

        function testHealth() {
            callAPI('/health');
        }

        function testGlossary() {
            callAPI('/glossary', { per_page: 5, has_etymology: 'true' });
        }

        function testKeys() {
            callAPI('/keys', { per_page: 3 });
        }

        function testStats() {
            callAPI('/stats/overview');
        }
    </script>
</body>
</html>
