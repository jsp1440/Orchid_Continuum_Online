<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchid Image Download Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        .dashboard-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .progress-bar-animated {
            animation: progress-shimmer 2s infinite;
        }
        @keyframes progress-shimmer {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .source-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }
        .source-card:hover {
            transform: translateX(5px);
        }
        .badge-active {
            background: linear-gradient(135deg, #10b981, #059669);
        }
        .badge-complete {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }
        .badge-pending {
            background: linear-gradient(135deg, #6b7280, #4b5563);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-4 mb-3">
                <i data-feather="download-cloud" style="color: #3b82f6;"></i>
                Orchid Image Download Dashboard
            </h1>
            <p class="lead text-muted">Real-time progress across all download sources</p>
        </div>

        <!-- Summary Stats -->
        <div class="row mb-4" id="summary-stats">
            <div class="col-md-4 mb-3">
                <div class="stat-card">
                    <div class="text-muted mb-2">Total Images</div>
                    <div class="stat-value" id="total-images">0</div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="stat-card">
                    <div class="text-muted mb-2">Total Size</div>
                    <div class="stat-value" id="total-size">0 GB</div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="stat-card">
                    <div class="text-muted mb-2">Overall Progress</div>
                    <div class="stat-value" id="overall-progress">0%</div>
                </div>
            </div>
        </div>

        <!-- Overall Progress Bar -->
        <div class="dashboard-card p-4 mb-4">
            <h5 class="mb-3">Overall Progress</h5>
            <div class="progress" style="height: 30px; border-radius: 15px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                     id="overall-progress-bar" 
                     role="progressbar" 
                     style="width: 0%; background: linear-gradient(90deg, #3b82f6, #8b5cf6);">
                    <span id="overall-progress-text">0%</span>
                </div>
            </div>
        </div>

        <!-- Download Sources -->
        <div class="dashboard-card p-4">
            <h5 class="mb-4">
                <i data-feather="database"></i>
                Download Sources
            </h5>
            <div id="sources-list"></div>
        </div>

        <!-- Last Updated -->
        <div class="text-center mt-4">
            <small class="text-muted">
                Last updated: <span id="last-updated">Never</span> • 
                Auto-refreshes every 3 seconds
            </small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch and update dashboard stats
        async function updateDashboard() {
            try {
                const response = await fetch('/api/download-stats');
                const data = await response.json();
                
                // Update summary stats
                document.getElementById('total-images').textContent = data.total_images.toLocaleString();
                document.getElementById('total-size').textContent = `${data.total_size_gb} GB`;
                document.getElementById('overall-progress').textContent = `${data.overall_progress}%`;
                
                // Update overall progress bar
                const progressBar = document.getElementById('overall-progress-bar');
                progressBar.style.width = `${data.overall_progress}%`;
                document.getElementById('overall-progress-text').textContent = `${data.overall_progress}%`;
                
                // Update sources list
                const sourcesList = document.getElementById('sources-list');
                sourcesList.innerHTML = data.sources.map(source => `
                    <div class="source-card">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="mb-0">${source.name}</h6>
                            <span class="badge badge-${source.status}">${source.status.toUpperCase()}</span>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6">
                                <small class="text-muted">Images:</small>
                                <strong class="ms-2">${source.count.toLocaleString()} / ${source.target.toLocaleString()}</strong>
                            </div>
                            <div class="col-6">
                                <small class="text-muted">Size:</small>
                                <strong class="ms-2">${source.size_mb} MB</strong>
                            </div>
                        </div>
                        <div class="progress" style="height: 20px; border-radius: 10px;">
                            <div class="progress-bar ${source.status === 'active' ? 'progress-bar-striped progress-bar-animated' : ''}" 
                                 role="progressbar" 
                                 style="width: ${source.progress}%; background-color: ${source.color};">
                                ${source.progress}%
                            </div>
                        </div>
                    </div>
                `).join('');
                
                // Update last updated timestamp
                const lastUpdated = new Date(data.last_updated);
                document.getElementById('last-updated').textContent = lastUpdated.toLocaleTimeString();
                
            } catch (error) {
                console.error('Error fetching dashboard stats:', error);
            }
        }

        // Initial load
        updateDashboard();
        
        // Auto-refresh every 3 seconds
        setInterval(updateDashboard, 3000);
        
        // Initialize Feather icons
        feather.replace();
    </script>
</body>
</html>
