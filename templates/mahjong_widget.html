<!-- Orchid Mahjong Widget - Migrated from Famous AI -->
<!-- Match orchid tiles in this relaxing puzzle game -->

<style>
    .mahjong-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
    }
    
    .mahjong-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .mahjong-header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    
    /* Game Stats */
    .game-stats {
        display: flex;
        justify-content: space-around;
        margin-bottom: 2rem;
        padding: 1rem;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
    }
    
    .stat {
        text-align: center;
    }
    
    .stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: #a78bfa;
    }
    
    .stat-label {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.9rem;
    }
    
    /* Game Board */
    .game-board {
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(139, 92, 246, 0.2);
        border-radius: 16px;
        padding: 2rem;
        min-height: 400px;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 0.5rem;
        margin-bottom: 2rem;
    }
    
    .tile {
        aspect-ratio: 1;
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.2));
        border: 2px solid rgba(139, 92, 246, 0.4);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
    }
    
    .tile:hover:not(.matched):not(.hidden) {
        transform: translateY(-4px);
        border-color: rgba(139, 92, 246, 0.8);
        box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
    }
    
    .tile.selected {
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(236, 72, 153, 0.4));
        border-color: #a78bfa;
        transform: scale(1.05);
    }
    
    .tile.matched {
        opacity: 0;
        pointer-events: none;
    }
    
    .tile.hidden {
        visibility: hidden;
    }
    
    /* Controls */
    .game-controls {
        display: flex;
        gap: 1rem;
        justify-content: center;
    }
    
    .btn {
        padding: 1rem 2rem;
        border: none;
        border-radius: 25px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
        color: white;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
    }
    
    .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.15);
    }
    
    /* Win Message */
    .win-message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.95), rgba(236, 72, 153, 0.95));
        padding: 3rem;
        border-radius: 20px;
        text-align: center;
        z-index: 1000;
        transition: transform 0.5s ease;
    }
    
    .win-message.show {
        transform: translate(-50%, -50%) scale(1);
    }
    
    .win-message h2 {
        font-size: 3rem;
        margin-bottom: 1rem;
    }
    
    @media (max-width: 768px) {
        .game-board {
            grid-template-columns: repeat(6, 1fr);
            gap: 0.25rem;
            padding: 1rem;
        }
        .tile {
            font-size: 1.5rem;
        }
    }
</style>

<div class="mahjong-container">
    <div class="mahjong-header">
        <h1>🀄 Orchid Mahjong</h1>
        <p style="color: rgba(255, 255, 255, 0.7);">Match pairs of beautiful orchid tiles!</p>
    </div>
    
    <!-- Game Stats -->
    <div class="game-stats">
        <div class="stat">
            <div class="stat-value" id="movesCount">0</div>
            <div class="stat-label">Moves</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="matchesCount">0</div>
            <div class="stat-label">Matches</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="timerDisplay">0:00</div>
            <div class="stat-label">Time</div>
        </div>
    </div>
    
    <!-- Game Board -->
    <div class="game-board" id="gameBoard">
        <!-- Tiles will be generated here -->
    </div>
    
    <!-- Controls -->
    <div class="game-controls">
        <button class="btn btn-primary" onclick="startNewGame()">🔄 New Game</button>
        <button class="btn btn-secondary" onclick="showHint()">💡 Hint</button>
    </div>
    
    <!-- Win Message -->
    <div class="win-message" id="winMessage">
        <h2>🎉 Congratulations! 🎉</h2>
        <p style="font-size: 1.5rem;">You matched all the orchids!</p>
        <p id="finalStats" style="margin-top: 1rem; font-size: 1.2rem;"></p>
        <button class="btn btn-primary" style="margin-top: 2rem;" onclick="startNewGame()">Play Again</button>
    </div>
</div>

<script>
// Orchid tiles (emojis)
const orchidTiles = ['🌺', '🌸', '🌼', '🌻', '🌷', '🏵️', '🥀', '💐', '🌹', '🪷', '🪻', '🌿'];

let tiles = [];
let selectedTiles = [];
let matchedPairs = 0;
let moves = 0;
let seconds = 0;
let timerInterval;
let gameStarted = false;

// Initialize game
function initGame() {
    // Create pairs of tiles (24 tiles = 12 pairs)
    tiles = [];
    for (let i = 0; i < 12; i++) {
        tiles.push(orchidTiles[i]);
        tiles.push(orchidTiles[i]);
    }
    
    // Shuffle tiles
    for (let i = tiles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
    }
    
    // Render board
    const board = document.getElementById('gameBoard');
    board.innerHTML = '';
    tiles.forEach((tile, index) => {
        const tileDiv = document.createElement('div');
        tileDiv.className = 'tile';
        tileDiv.textContent = tile;
        tileDiv.dataset.index = index;
        tileDiv.dataset.value = tile;
        tileDiv.addEventListener('click', () => handleTileClick(index));
        board.appendChild(tileDiv);
    });
    
    // Reset stats
    selectedTiles = [];
    matchedPairs = 0;
    moves = 0;
    seconds = 0;
    gameStarted = false;
    updateStats();
    
    if (timerInterval) {
        clearInterval(timerInterval);
    }
}

function handleTileClick(index) {
    const tileElement = document.querySelectorAll('.tile')[index];
    
    // Ignore if already matched or selected
    if (tileElement.classList.contains('matched') || 
        tileElement.classList.contains('selected')) {
        return;
    }
    
    // Start timer on first click
    if (!gameStarted) {
        startTimer();
        gameStarted = true;
    }
    
    // Select tile
    tileElement.classList.add('selected');
    selectedTiles.push(index);
    
    // Check for match when 2 tiles selected
    if (selectedTiles.length === 2) {
        moves++;
        updateStats();
        checkMatch();
    }
}

function checkMatch() {
    const [index1, index2] = selectedTiles;
    const tile1 = document.querySelectorAll('.tile')[index1];
    const tile2 = document.querySelectorAll('.tile')[index2];
    
    setTimeout(() => {
        if (tile1.dataset.value === tile2.dataset.value) {
            // Match found!
            tile1.classList.add('matched');
            tile2.classList.add('matched');
            matchedPairs++;
            updateStats();
            
            // Check for win
            if (matchedPairs === 12) {
                winGame();
            }
        } else {
            // No match
            tile1.classList.remove('selected');
            tile2.classList.remove('selected');
        }
        
        selectedTiles = [];
    }, 600);
}

function updateStats() {
    document.getElementById('movesCount').textContent = moves;
    document.getElementById('matchesCount').textContent = matchedPairs;
}

function startTimer() {
    timerInterval = setInterval(() => {
        seconds++;
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        document.getElementById('timerDisplay').textContent = 
            `${mins}:${secs.toString().padStart(2, '0')}`;
    }, 1000);
}

function winGame() {
    clearInterval(timerInterval);
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    const timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
    
    document.getElementById('finalStats').textContent = 
        `Time: ${timeStr} | Moves: ${moves}`;
    
    setTimeout(() => {
        document.getElementById('winMessage').classList.add('show');
    }, 500);
}

function startNewGame() {
    document.getElementById('winMessage').classList.remove('show');
    initGame();
}

function showHint() {
    if (matchedPairs === 12) return;
    
    // Find two unmatched tiles with same value
    const unmatchedTiles = Array.from(document.querySelectorAll('.tile'))
        .filter(tile => !tile.classList.contains('matched'));
    
    for (let i = 0; i < unmatchedTiles.length; i++) {
        for (let j = i + 1; j < unmatchedTiles.length; j++) {
            if (unmatchedTiles[i].dataset.value === unmatchedTiles[j].dataset.value) {
                // Flash the matching pair
                unmatchedTiles[i].style.background = 'rgba(236, 72, 153, 0.5)';
                unmatchedTiles[j].style.background = 'rgba(236, 72, 153, 0.5)';
                
                setTimeout(() => {
                    unmatchedTiles[i].style.background = '';
                    unmatchedTiles[j].style.background = '';
                }, 1000);
                return;
            }
        }
    }
}

// Initialize game on load
initGame();
</script>
