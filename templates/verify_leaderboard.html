<!doctype html><html><head>
<meta charset="utf-8"><title>Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:system-ui,Arial;margin:16px}table{border-collapse:collapse}td,th{padding:8px 12px;border-bottom:1px solid #ddd}</style>
</head><body>
<h2>Member Leaderboard</h2>
<table>
<tr><th>#</th><th>Member</th><th>Score</th><th>Votes</th></tr>
{% for i,row in enumerate(rows, start=1) %}
<tr><td>{{ i }}</td><td>{{ row.display_name }}</td><td>{{ row.score }}</td><td>{{ row.votes }}</td></tr>
{% endfor %}
</table>
</body></html>
