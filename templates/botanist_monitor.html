<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Botanist Vision AI - Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0e27; color: #e0e0e0; }
        .stat-card { background: #1a1f3a; border: 1px solid #2a3f5f; border-radius: 8px; padding: 20px; margin: 10px 0; }
        .stat-value { font-size: 2.5rem; font-weight: bold; color: #4CAF50; }
        .stat-label { font-size: 0.9rem; color: #999; }
        .result-card { background: #1a1f3a; border-left: 3px solid #4CAF50; padding: 15px; margin: 10px 0; }
        .accuracy-perfect { border-left-color: #4CAF50; }
        .accuracy-genus { border-left-color: #FFC107; }
        .accuracy-incorrect { border-left-color: #F44336; }
        .specimen-img { max-width: 200px; border-radius: 4px; cursor: pointer; }
        .drawing-toggle { margin-top: 10px; }
        .toggle-btn { padding: 5px 15px; border: none; border-radius: 4px; cursor: pointer; background: #2a3f5f; color: #fff; margin-right: 5px; }
        .toggle-btn.active { background: #4CAF50; }
        .drawing-badge { background: #4CAF50; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="container-fluid mt-4">
        <h1 class="mb-4">🔬 Digital Botanist Vision AI Monitor</h1>
        
        <!-- Statistics Dashboard -->
        <div class="row" id="stats-container">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-value" id="total-analyzed">--</div>
                    <div class="stat-label">Total Analyzed</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-value" id="accuracy-rate">--</div>
                    <div class="stat-label">Perfect ID Rate</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-value" id="genus-rate">--</div>
                    <div class="stat-label">Genus Accuracy</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-value" id="total-cost">--</div>
                    <div class="stat-label">Total Cost</div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-12">
                <h3>Recent Results</h3>
                <div id="results-container"></div>
            </div>
        </div>
    </div>
    
    <script>
        function updateDashboard() {
            // Fetch stats
            fetch('/botanist/api/stats')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('total-analyzed').textContent = data.total_analyzed || 0;
                    document.getElementById('accuracy-rate').textContent = (data.accuracy_rate || 0) + '%';
                    document.getElementById('genus-rate').textContent = (data.genus_accuracy_rate || 0) + '%';
                    document.getElementById('total-cost').textContent = '$' + (data.total_cost || 0).toFixed(2);
                })
                .catch(err => console.log('Waiting for data...'));
            
            // Fetch recent results
            fetch('/botanist/api/recent_results')
                .then(r => r.json())
                .then(results => {
                    const container = document.getElementById('results-container');
                    container.innerHTML = results.map((r, idx) => {
                        const accuracyClass = r.accuracy === 'perfect' ? 'accuracy-perfect' : 
                                            r.accuracy === 'genus_only' ? 'accuracy-genus' : 'accuracy-incorrect';
                        
                        // Check which drawing types exist
                        const hasScientific = r.botanical_drawing_url;
                        const hasLabeled = r.labeled_drawing_url;
                        const hasArtistic = r.artistic_illustration_url;
                        const hasColoring = r.coloring_page_url;
                        
                        // Create badges for available drawings
                        let drawingBadges = '';
                        if (hasScientific) drawingBadges += '<span class="drawing-badge">📐 Scientific</span> ';
                        if (hasArtistic) drawingBadges += '<span class="drawing-badge">🎨 Artistic</span> ';
                        if (hasColoring) drawingBadges += '<span class="drawing-badge">🖍️ Coloring</span> ';
                        
                        // Image toggle controls (4-way toggle if drawings exist)
                        const imageToggle = hasScientific ? `
                            <div class="drawing-toggle">
                                <button class="toggle-btn active" onclick="showView(${idx}, 'photo')">📸 Photo</button>
                                ${hasScientific ? `<button class="toggle-btn" onclick="showView(${idx}, 'scientific')">📐 Scientific</button>` : ''}
                                ${hasLabeled ? `<button class="toggle-btn" onclick="showView(${idx}, 'labeled')">🏷️ Labeled</button>` : ''}
                                ${hasArtistic ? `<button class="toggle-btn" onclick="showView(${idx}, 'artistic')">🎨 Artistic</button>` : ''}
                                ${hasColoring ? `<button class="toggle-btn" onclick="showView(${idx}, 'coloring')">🖍️ Coloring</button>` : ''}
                            </div>
                            ${hasScientific || hasArtistic || hasColoring ? `
                                <div class="mt-2">
                                    <small>Download: </small>
                                    ${hasScientific ? `<a href="/botanist/download/${r.id}/scientific/png" class="btn btn-sm btn-outline-light me-1">📐 PNG</a>` : ''}
                                    ${hasScientific ? `<a href="/botanist/download/${r.id}/scientific/jpeg" class="btn btn-sm btn-outline-light me-1">📐 JPG</a>` : ''}
                                    ${hasScientific ? `<a href="/botanist/download/${r.id}/scientific/pdf" class="btn btn-sm btn-outline-light me-1">📐 PDF</a>` : ''}
                                    ${hasArtistic ? `<a href="/botanist/download/${r.id}/artistic/png" class="btn btn-sm btn-outline-light me-1">🎨 PNG</a>` : ''}
                                    ${hasColoring ? `<a href="/botanist/download/${r.id}/coloring/png" class="btn btn-sm btn-outline-light">🖍️ PNG</a>` : ''}
                                </div>
                            ` : ''}
                        ` : '';
                        
                        return `
                            <div class="result-card ${accuracyClass}" id="result-${idx}">
                                <div class="row">
                                    <div class="col-md-3">
                                        <img src="${r.image_url}" 
                                             class="specimen-img" 
                                             alt="Specimen" 
                                             id="img-${idx}"
                                             data-photo="${r.image_url}"
                                             data-scientific="${r.botanical_drawing_url || ''}"
                                             data-labeled="${r.labeled_drawing_url || ''}"
                                             data-artistic="${r.artistic_illustration_url || ''}"
                                             data-coloring="${r.coloring_page_url || ''}">
                                        ${imageToggle}
                                    </div>
                                    <div class="col-md-9">
                                        <h5>${drawingBadges}AI Identification: <em>${r.ai_genus} ${r.ai_species}</em> (${(r.ai_confidence * 100).toFixed(0)}% confidence)</h5>
                                        <p><strong>Actual:</strong> <em>${r.actual_genus} ${r.actual_species}</em></p>
                                        <p><strong>Accuracy:</strong> ${r.accuracy}</p>
                                        <p><strong>Characters:</strong> ${r.flower_count || '?'} flowers, labellum: ${r.labellum_color || 'not visible'}, ${r.inflorescence_type || 'unknown'}</p>
                                        <p style="font-size: 0.9em;">${r.description ? r.description.substring(0, 200) + '...' : 'No description'}</p>
                                        <small class="text-muted">Cost: $${r.cost.toFixed(4)} | Time: ${r.time.toFixed(1)}s | ${new Date(r.timestamp).toLocaleString()}</small>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                })
                .catch(err => console.log('No results yet'));
        }
        
        // Toggle between photo/scientific/labeled/artistic/coloring views
        function showView(idx, view) {
            const img = document.getElementById(`img-${idx}`);
            const buttons = document.querySelectorAll(`#result-${idx} .toggle-btn`);
            
            // Remove active from all buttons
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Set image source based on view type
            const viewMap = {
                'photo': img.dataset.photo,
                'scientific': img.dataset.scientific,
                'labeled': img.dataset.labeled,
                'artistic': img.dataset.artistic,
                'coloring': img.dataset.coloring
            };
            
            if (viewMap[view]) {
                img.src = viewMap[view];
                // Find and activate the clicked button
                buttons.forEach((btn, i) => {
                    if (btn.textContent.toLowerCase().includes(view) || 
                        (view === 'photo' && i === 0)) {
                        btn.classList.add('active');
                    }
                });
            }
        }
        
        // Update every 5 seconds
        updateDashboard();
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
