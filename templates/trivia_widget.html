<!-- Orchid Trivia Challenge Widget - Migrated from Famous AI -->
<!-- Fascinating orchid facts on flip cards -->

<style>
    .trivia-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
    }
    
    .trivia-header {
        text-align: center;
        margin-bottom: 3rem;
    }
    
    .trivia-header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
    }
    
    .trivia-subtitle {
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.7);
        font-style: italic;
    }
    
    .trivia-card {
        perspective: 1000px;
        margin: 2rem auto;
        max-width: 600px;
    }
    
    .card-inner {
        position: relative;
        width: 100%;
        min-height: 300px;
        transition: transform 0.6s;
        transform-style: preserve-3d;
        cursor: pointer;
    }
    
    .card-inner.flipped {
        transform: rotateY(180deg);
    }
    
    .card-face {
        position: absolute;
        width: 100%;
        min-height: 300px;
        backface-visibility: hidden;
        border-radius: 16px;
        padding: 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    .card-front {
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.2) 0%, rgba(236, 72, 153, 0.2) 100%);
        border: 2px solid rgba(139, 92, 246, 0.4);
    }
    
    .card-back {
        background: linear-gradient(135deg, rgba(236, 72, 153, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
        border: 2px solid rgba(236, 72, 153, 0.4);
        transform: rotateY(180deg);
    }
    
    .card-emoji {
        font-size: 4rem;
        margin-bottom: 1rem;
        animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
    }
    
    .card-prompt {
        font-size: 1.3rem;
        font-weight: 600;
        color: #a78bfa;
        margin-bottom: 1rem;
    }
    
    .card-fact {
        font-size: 1.1rem;
        line-height: 1.8;
        color: rgba(255, 255, 255, 0.9);
    }
    
    .card-category {
        display: inline-block;
        padding: 0.5rem 1rem;
        background: rgba(139, 92, 246, 0.2);
        border-radius: 20px;
        font-size: 0.9rem;
        color: #a78bfa;
        margin-top: 1rem;
    }
    
    .trivia-controls {
        text-align: center;
        margin-top: 2rem;
    }
    
    .btn-next {
        padding: 1rem 2.5rem;
        font-size: 1.1rem;
        font-weight: 600;
        background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
        border: none;
        border-radius: 50px;
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
    }
    
    .btn-next:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(139, 92, 246, 0.6);
    }
    
    .trivia-counter {
        text-align: center;
        margin-top: 1.5rem;
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.9rem;
    }
    
    @media (max-width: 768px) {
        .trivia-header h1 {
            font-size: 2rem;
        }
        .card-face {
            padding: 2rem;
            min-height: 250px;
        }
        .card-emoji {
            font-size: 3rem;
        }
    }
</style>

<div class="trivia-container">
    <div class="trivia-header">
        <h1>🌿 Welcome to FCOS Orchid Trivia! 🌸</h1>
        <p class="trivia-subtitle">✨ Click the card to reveal an enchanting orchid secret! ✨</p>
    </div>
    
    <div class="trivia-card" id="triviaCard">
        <div class="card-inner" id="cardInner">
            <div class="card-face card-front">
                <div class="card-emoji" id="cardEmoji">🌺</div>
                <div class="card-prompt">Click to reveal a fascinating orchid fact!</div>
            </div>
            <div class="card-face card-back">
                <div class="card-fact" id="cardFact">Loading amazing orchid knowledge...</div>
                <div class="card-category" id="cardCategory">Orchid Science</div>
            </div>
        </div>
    </div>
    
    <div class="trivia-controls">
        <button class="btn-next" id="nextBtn">✨ Next Fact ➤</button>
    </div>
    
    <div class="trivia-counter">
        <span id="factCounter">Fact 1 of many amazing discoveries</span>
    </div>
</div>

<script>
// Fascinating orchid trivia facts database - USER REQUESTED: Truly fascinating, educational content
const orchidTrivia = [
    {
        emoji: "🌺",
        fact: "Vanilla is an orchid! The vanilla orchid (Vanilla planifolia) is the only orchid cultivated for food, producing the world's most popular flavoring.",
        category: "Culinary Orchids"
    },
    {
        emoji: "🐝",
        fact: "Some orchids mimic female bees so perfectly that male bees attempt to mate with the flowers, unknowingly pollinating them in the process. This deceptive pollination is called pseudocopulation!",
        category: "Pollination Mysteries"
    },
    {
        emoji: "👻",
        fact: "The Ghost Orchid (Dendrophylax lindenii) has no leaves and appears to float in mid-air! It photosynthesizes through its roots and can take up to 10 years to bloom.",
        category: "Rare Beauties"
    },
    {
        emoji: "🌍",
        fact: "Orchids are found on every continent except Antarctica, with over 35,000 species described - making them one of the largest plant families on Earth!",
        category: "Global Distribution"
    },
    {
        emoji: "🔬",
        fact: "Orchid seeds are microscopic - one seed pod can contain millions of dust-like seeds! They're so small they can only be seen under a microscope.",
        category: "Botanical Wonders"
    },
    {
        emoji: "🍄",
        fact: "Orchid seeds can't germinate without mycorrhizal fungi! These symbiotic fungi provide nutrients to help the tiny seeds develop into plants - a partnership millions of years old that could help sequester carbon from atmosphere to soil!",
        category: "Mycorrhizal Networks"
    },
    {
        emoji: "💰",
        fact: "The most expensive orchid ever sold was a Shenzhen Nongke Orchid for $200,000 in 2005! It took 8 years of research to develop and blooms only once every 4-5 years.",
        category: "Orchid Economics"
    },
    {
        emoji: "🦎",
        fact: "The Monkey Face Orchid (Dracula simia) has flowers that look exactly like tiny monkey faces! Found in Ecuador, it even smells like ripe oranges.",
        category: "Remarkable Mimicry"
    },
    {
        emoji: "🌙",
        fact: "Some orchids bloom only at night! Epidendrum nocturnum releases its sweet fragrance after sunset to attract nocturnal pollinators like moths.",
        category: "Night Bloomers"
    },
    {
        emoji: "🎨",
        fact: "Orchids can change color based on light, temperature, and soil conditions! Some varieties shift from white to pink or purple as they mature.",
        category: "Color Chemistry"
    },
    {
        emoji: "🏔️",
        fact: "The world's smallest orchid (Platystele jungermannioides) has flowers barely 2mm across - smaller than a pinhead! Discovered in Ecuador's cloud forests.",
        category: "Size Extremes"
    },
    {
        emoji: "🌿",
        fact: "Most orchids are epiphytes - they grow on other plants without harming them! Their aerial roots absorb moisture and nutrients from the air and rain.",
        category: "Growth Habits"
    },
    {
        emoji: "💎",
        fact: "Ancient Greeks believed orchids were symbols of virility and fertility. The word 'orchid' comes from the Greek 'orchis' meaning testicle, referring to the shape of the root tubers!",
        category: "Cultural History"
    },
    {
        emoji: "🧬",
        fact: "Orchids have relatively small DNA genomes yet produce the most diverse flower forms in the plant kingdom - a masterclass in genetic efficiency!",
        category: "Genetics"
    },
    {
        emoji: "🎭",
        fact: "The Bee Orchid (Ophrys apifera) is so skilled at mimicking bees that it rarely needs actual pollinators - it can self-pollinate as a backup strategy!",
        category: "Evolutionary Adaptation"
    },
    {
        emoji: "🌊",
        fact: "Some orchids can live for over 100 years! The oldest recorded orchid lived in Singapore's Botanic Gardens for over 159 years.",
        category: "Longevity"
    },
    {
        emoji: "🔮",
        fact: "Victorian orchid hunters risked their lives exploring remote jungles to find rare specimens. Many died in pursuit of these 'botanical treasures' during the 19th century Orchid Mania.",
        category: "Historical Exploration"
    },
    {
        emoji: "🌈",
        fact: "Orchids produce the most varied flower colors of any plant family - except true blue! Scientists are still working to genetically engineer a truly blue orchid.",
        category: "Pigment Science"
    },
    {
        emoji: "🕷️",
        fact: "The Spider Orchid (Brassia) has flowers with long, spidery sepals that can span up to 15 inches! Some species even smell like rotting meat to attract carrion flies.",
        category: "Unusual Forms"
    },
    {
        emoji: "💧",
        fact: "Orchids in cloud forests get most of their water from mist and fog! Their specialized roots have a spongy coating called velamen that absorbs atmospheric moisture.",
        category: "Water Adaptation"
    },
    {
        emoji: "🌱",
        fact: "Companion plants like tropical ferns, bromeliads, and tillandsias often grow alongside orchids in nature, creating miniature ecosystems that support biodiversity!",
        category: "Companion Plants"
    }
];

let currentFactIndex = 0;
const cardInner = document.getElementById('cardInner');
const cardEmoji = document.getElementById('cardEmoji');
const cardFact = document.getElementById('cardFact');
const cardCategory = document.getElementById('cardCategory');
const nextBtn = document.getElementById('nextBtn');
const factCounter = document.getElementById('factCounter');

// Load initial fact
function loadFact(index) {
    const fact = orchidTrivia[index];
    cardEmoji.textContent = fact.emoji;
    cardFact.textContent = fact.fact;
    cardCategory.textContent = fact.category;
    factCounter.textContent = `Fact ${index + 1} of ${orchidTrivia.length}`;
}

// Card flip on click
cardInner.addEventListener('click', function() {
    this.classList.toggle('flipped');
});

// Next fact button
nextBtn.addEventListener('click', function() {
    // Unflip if flipped
    if (cardInner.classList.contains('flipped')) {
        cardInner.classList.remove('flipped');
    }
    
    // Wait for unflip animation, then change fact
    setTimeout(() => {
        currentFactIndex = (currentFactIndex + 1) % orchidTrivia.length;
        loadFact(currentFactIndex);
    }, 300);
});

// Load first fact
loadFact(0);
</script>
