<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Submission Widget</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body { 
            background: transparent; 
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .submission-widget {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .widget-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .widget-header h3 {
            color: white;
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }
        .form-group {
            background: rgba(255,255,255,0.95);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
        }
        .form-control:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
        }
        textarea.form-control {
            min-height: 200px;
            font-family: monospace;
        }
        .preview-pane {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-top: 10px;
            min-height: 200px;
            color: #333;
        }
        .preview-pane h1,
        .preview-pane h2,
        .preview-pane h3 {
            color: #667eea;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.3);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .tab-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        .tab-btn.active {
            background: white;
            color: #667eea;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d4aa, #6B3FA0);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,212,170,0.4);
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .success-message {
            background: #10b981;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .error-message {
            background: #ef4444;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="submission-widget">
        <div class="widget-header">
            <h3><i data-feather="edit"></i> Submit Article</h3>
            <p style="color: rgba(255,255,255,0.9); margin-top: 10px;">Share your orchid knowledge with the community</p>
        </div>
        
        <div class="success-message" id="successMessage">
            <i data-feather="check-circle"></i> Article submitted successfully! Our team will review it soon.
        </div>
        
        <div class="error-message" id="errorMessage">
            <i data-feather="alert-circle"></i> <span id="errorText">Something went wrong. Please try again.</span>
        </div>
        
        <form id="articleForm">
            <div class="form-group">
                <label class="form-label">Article Title *</label>
                <input type="text" class="form-control" id="title" required placeholder="e.g., Growing Phalaenopsis in Humid Climates">
            </div>
            
            <div class="form-group">
                <label class="form-label">Author Name *</label>
                <input type="text" class="form-control" id="author" required placeholder="Your name">
            </div>
            
            <div class="form-group">
                <label class="form-label">Your Email *</label>
                <input type="email" class="form-control" id="email" required placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label class="form-label">Category</label>
                <select class="form-control" id="category">
                    <option value="care">Care & Cultivation</option>
                    <option value="breeding">Breeding & Hybridization</option>
                    <option value="research">Research & Science</option>
                    <option value="conservation">Conservation</option>
                    <option value="photography">Photography</option>
                    <option value="general">General</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Article Content * (Markdown supported)</label>
                <div class="tab-buttons">
                    <button type="button" class="tab-btn active" onclick="showTab('write')">Write</button>
                    <button type="button" class="tab-btn" onclick="showTab('preview')">Preview</button>
                </div>
                <textarea class="form-control" id="content" required placeholder="Write your article here... Markdown formatting is supported!"></textarea>
                <div class="preview-pane" id="previewPane" style="display: none;"></div>
            </div>
            
            <button type="submit" class="submit-btn">
                <i data-feather="send"></i> Submit Article
            </button>
        </form>
    </div>

    <script>
        feather.replace();
        
        let currentTab = 'write';
        
        // Tab switching
        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'write') {
                document.getElementById('content').style.display = 'block';
                document.getElementById('previewPane').style.display = 'none';
            } else {
                const content = document.getElementById('content').value;
                const html = marked.parse(content || '*No content yet...*');
                document.getElementById('previewPane').innerHTML = html;
                document.getElementById('content').style.display = 'none';
                document.getElementById('previewPane').style.display = 'block';
            }
        }
        
        // Form submission
        document.getElementById('articleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                email: document.getElementById('email').value,
                category: document.getElementById('category').value,
                content: document.getElementById('content').value,
                status: 'pending'
            };
            
            try {
                const response = await fetch('/articles/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('errorMessage').style.display = 'none';
                    document.getElementById('articleForm').reset();
                    
                    // Hide success message after 5 seconds
                    setTimeout(() => {
                        document.getElementById('successMessage').style.display = 'none';
                    }, 5000);
                } else {
                    throw new Error('Submission failed');
                }
            } catch (error) {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('successMessage').style.display = 'none';
                document.getElementById('errorText').textContent = error.message || 'Something went wrong. Please try again.';
            }
            
            feather.replace();
        });
        
        // Auto-preview update
        document.getElementById('content').addEventListener('input', function() {
            if (currentTab === 'preview') {
                const html = marked.parse(this.value || '*No content yet...*');
                document.getElementById('previewPane').innerHTML = html;
            }
        });
    </script>
</body>
</html>
