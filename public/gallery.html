<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FCOS Geo-Thematic Orchid Gallery</title>
<style>
  /* Page shell */
  html,body{margin:0;background:#fafafa;color:#0f172a;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .host{max-width:1200px;margin:0 auto;padding:14px}

  /* Widget styles (scoped via container id to keep simple) */
  #fcos *{box-sizing:border-box}
  #fcos .wrap{background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:12px}
  #fcos .topbar{position:sticky;top:0;background:linear-gradient(#fff,#fff);z-index:10}
  #fcos .titlebar{display:flex;gap:.6rem;align-items:center;padding:.6rem 1rem;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:8px;overflow:hidden}
  #fcos .title{white-space:nowrap;font-weight:700;font-size:1.05rem}
  #fcos .title--drift{display:inline-block;animation:fcosDrift 30s ease-in-out infinite alternate;will-change:transform}
  @keyframes fcosDrift{from{transform:translateX(0)} to{transform:translateX(-6%)}}
  @media (prefers-reduced-motion:reduce){ #fcos .title--drift{animation:none} }

  #fcos .controls{padding:8px;border-top:1px solid #f1f5f9;margin-top:8px}
  #fcos .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  #fcos label{font-size:12px;color:#334155;display:flex;flex-direction:column;gap:4px}
  #fcos select,#fcos input[type="number"]{padding:8px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;min-width:140px}
  #fcos .btn{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;cursor:pointer}
  #fcos .btn:hover{background:#f1f5f9}
  #fcos .btn[aria-pressed="true"]{background:#e2e8f0}

  #fcos .mapwrap{display:none;margin-top:8px;border:1px dashed #cbd5e1;border-radius:10px;overflow:hidden}
  #fcos .mapwrap.active{display:block}
  #fcos canvas.map{display:block;width:100%;height:220px;background:linear-gradient(180deg,#eef6ff,#fff)}

  #fcos .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px;transition:opacity 600ms ease}
  #fcos .gallery--fade{opacity:.25}
  #fcos .card{border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column;min-height:100%}
  #fcos .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f1f5f9}
  #fcos .cap{padding:10px;font-size:13px;line-height:1.25;color:#334155}
  #fcos .muted{color:#64748b;font-size:12px}

  #fcos .footer{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:10px}
</style>
</head>
<body>
<div class="host">
  <div id="fcos">
    <div class="wrap">
      <div class="topbar">
        <div class="titlebar" id="titlebar" aria-live="polite">
          <span id="title" class="title">Orchid Gallery</span>
          <button id="motion" class="btn" type="button" style="margin-left:auto">Pause</button>
        </div>
        <div class="controls">
          <div class="row">
            <label>Country
              <select id="country"></select>
            </label>
            <label>Genus
              <select id="genus" multiple size="1" style="min-width:160px"></select>
            </label>
            <label>Temp
              <select id="temp">
                <option value="">All</option>
                <option value="cold">cold</option>
                <option value="cool">cool</option>
                <option value="intermediate">intermediate</option>
                <option value="warm">warm</option>
                <option value="hot">hot</option>
              </select>
            </label>
            <label>Elevation (m)
              <div style="display:flex;gap:6px">
                <input id="minElev" type="number" placeholder="min" style="width:90px" />
                <input id="maxElev" type="number" placeholder="max" style="width:90px" />
              </div>
            </label>
            <button id="apply" class="btn">Apply Filters</button>
            <button id="clear" class="btn" title="Reset filters">Reset</button>
            <button id="mapToggle" class="btn" aria-pressed="false">Map: Off</button>
          </div>
        </div>
      </div>

      <div class="mapwrap" id="mapwrap">
        <canvas class="map" id="mapCanvas" width="1200" height="300" aria-label="Distribution map"></canvas>
        <div class="muted" style="padding:6px 10px">Dots indicate approximate photo localities.</div>
      </div>

      <div class="gallery" id="gallery" role="list"></div>

      <div class="footer">
        <div class="muted" id="count">0 results</div>
        <div style="display:flex;gap:8px;align-items:center">
          <button id="prev" class="btn">Prev</button>
          <span class="muted" id="pageInfo">1 / 1</span>
          <button id="next" class="btn">Next</button>
          <button id="rotate" class="btn" aria-pressed="false" title="Auto-rotate pages">Auto</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- Config ---------- */
const API_PATH = '/api/orchids';   // Replit proxy route
const PAGE_SIZE = 60;

/* ---------- Helpers ---------- */
const COUNTRY_LIST = [
  {iso2:"PG",name:"Papua New Guinea"},{iso2:"AU",name:"Australia"},{iso2:"ID",name:"Indonesia"},
  {iso2:"MY",name:"Malaysia"},{iso2:"CN",name:"China"},{iso2:"EC",name:"Ecuador"},
  {iso2:"PE",name:"Peru"},{iso2:"US",name:"United States"}
];
const $ = sel => document.querySelector(sel);
const ihtml = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const humanCountry = c => (COUNTRY_LIST.find(x=>x.iso2===c)||{}).name || c || "";
const dedupe = a => [...new Set(a)].filter(Boolean);

/* parse URL hash presets */
function parseHash(){
  const p = new URLSearchParams(location.hash.replace(/^#/,''));
  return {
    title: p.get('title'),
    drift: p.get('drift'), // 1|0
    rotate: p.get('rotate'),
    interval: parseInt(p.get('interval')||'',10),
    country: p.get('country'),
    genus: (p.get('genus')||'').split(',').map(s=>s.trim()).filter(Boolean),
    temp: p.get('temp'),
    minElev: parseInt(p.get('min_elev')||'',10),
    maxElev: parseInt(p.get('max_elev')||'',10),
    map: p.get('map')
  };
}

/* normalize various upstream field names to our schema */
function normalizeItem(raw){
  const it = {...raw};
  it.genus = it.genus || it.Genus || it.GENUS || "";
  it.species = it.species || it.Species || it.SPECIES || it.sp || "";
  it.display_name = it.display_name || it.displayName || it.name || `${it.genus||""} ${it.species||""}`.trim();

  it.country_iso2 = it.country_iso2 || it.country || it.country_code || it.countryCode || "";
  it.region = it.region || it.state || it.province || it.admin1 || "";
  it.locality_note = it.locality_note || it.locality || it.location_note || "";

  it.temperature_class = it.temperature_class || it.temp || it.temp_class || it.tempClass || "";
  const elev = it.elevation_m ?? it.elevation ?? it.altitude ?? it.elev_m;
  it.elevation_m = Number.isFinite(+elev) ? +elev : undefined;

  const lat = it.lat ?? it.latitude ?? it.Latitude;
  const lng = it.lng ?? it.longitude ?? it.Longitude ?? it.lon;
  it.lat = (lat==null)?undefined:+lat;
  it.lng = (lng==null)?undefined:+lng;

  it.img_url = it.img_url || it.image_url || it.imageUrl || it.photo || it.photo_url || "";
  it.credit = it.credit || it.photo_credit || it.attribution || "";
  it.grown_by = it.grown_by || it.grower || "";
  it.notes = it.notes || it.note || "";
  const refs = it.source_refs || it.references || it.refs || [];
  if(Array.isArray(refs)) it.source_refs = refs;
  else if (refs && typeof refs==='object'){
    it.source_refs = Object.entries(refs).map(([label,url])=>({label,url}));
  } else it.source_refs = [];

  return it;
}

function italicName(it){
  const n = it.display_name || `${it.genus||""} ${it.species||""}`.trim();
  return `<i>${ihtml(n)}</i>`;
}
function fmtElev(m){ return Number.isFinite(m) ? `~${Math.round(m)} m` : ""; }
function caption(it){
  const parts = [];
  parts.push(italicName(it));
  const loc = [it.region, humanCountry(it.country_iso2)].filter(Boolean).join(", ");
  if(it.locality_note || loc) parts.push(`Found in ${ihtml(it.locality_note || loc)}`);
  const tail = [fmtElev(it.elevation_m), it.temperature_class?`${ihtml(it.temperature_class)} grower`:""].filter(Boolean).join(" • ");
  if(tail) parts.push(tail);
  if(it.notes) parts.push(ihtml(it.notes));
  if(it.grown_by) parts.push(ihtml(it.grown_by));
  if(it.credit) parts.push(ihtml(it.credit));
  if(it.source_refs?.length){
    parts.push(it.source_refs.map(r=>`<a href="${r.url}" target="_blank" rel="noopener">${ihtml(r.label)}</a>`).join(" · "));
  }
  return parts.join("<br>");
}

/* ---------- State ---------- */
const state = {
  titleDrift: true,
  motionPaused: false,
  rotateDefault: true,
  rotateTimer: null,
  rotateInterval: 120000,
  pageSize: PAGE_SIZE,
  offset: 0,
  total: 0,
  mapOn: false,
  filters: { country:"", genus:[], temp:"", min_elev:undefined, max_elev:undefined },
  lastItems: [],
  generaFacet: []
};

/* ---------- UI setup ---------- */
function setTitle(txt, drift=true){
  const el = $('#title');
  el.textContent = txt || 'Orchid Gallery';
  el.classList.toggle('title--drift', !!drift);
}
function applyURL(){
  const h = parseHash();
  setTitle(h.title || 'Orchid Gallery', h.drift===null?true:h.drift==='1');
  if(h.rotate==='1') state.rotateDefault = true;
  if(h.rotate==='0') state.rotateDefault = false;
  if(Number.isFinite(h.interval) && h.interval>=30000) state.rotateInterval = h.interval;

  if(h.country) state.filters.country = h.country.toUpperCase();
  if(h.genus?.length) state.filters.genus = dedupe(h.genus);
  if(h.temp) state.filters.temp = h.temp;
  if(Number.isFinite(h.minElev)) state.filters.min_elev = h.minElev;
  if(Number.isFinite(h.maxElev)) state.filters.max_elev = h.maxElev;
  if(h.map==='1') state.mapOn = true;
  if(h.map==='0') state.mapOn = false;
}
function populateControls(){
  // Country
  const csel = $('#country');
  csel.innerHTML = `<option value="">All</option>` + COUNTRY_LIST.map(c=>{
    const sel = c.iso2 === state.filters.country ? 'selected' : '';
    return `<option value="${c.iso2}" ${sel}>${ihtml(c.name)}</option>`;
  }).join('');
  // Genus from cached facet (populated after first fetch)
  const gsel = $('#genus');
  const list = (state.generaFacet.length ? state.generaFacet : []).sort();
  gsel.innerHTML = list.map(g=>{
    const sel = state.filters.genus.includes(g) ? 'selected' : '';
    return `<option value="${ihtml(g)}" ${sel}>${ihtml(g)}</option>`;
  }).join('');
  // Temp/elev
  if(state.filters.temp) $('#temp').value = state.filters.temp;
  if(Number.isFinite(state.filters.min_elev)) $('#minElev').value = state.filters.min_elev;
  if(Number.isFinite(state.filters.max_elev)) $('#maxElev').value = state.filters.max_elev;

  toggleMap(state.mapOn);
}

/* ---------- Data ---------- */
async function fetchOrchids({offset=0, limit=PAGE_SIZE}={}){
  const q = new URLSearchParams();
  const set = (k,v)=>{ if(v!==undefined && v!==null && v!=="") q.set(k, Array.isArray(v)?v.join(','):String(v)); };
  set('limit', limit); set('offset', offset);
  set('country', state.filters.country || undefined);
  set('genus', state.filters.genus?.length ? state.filters.genus : undefined);
  set('temp', state.filters.temp || undefined);
  set('min_elev', Number.isFinite(state.filters.min_elev)?state.filters.min_elev:undefined);
  set('max_elev', Number.isFinite(state.filters.max_elev)?state.filters.max_elev:undefined);

  const url = `${API_PATH}?${q.toString()}`;
  const r = await fetch(url,{headers:{'accept':'application/json'}});
  if(!r.ok) throw new Error(`API ${r.status}`);
  const data = await r.json();

  let items = data.items || data.results || data.data || data.rows || data || [];
  if(!Array.isArray(items)) items = Array.isArray(data) ? data : [];
  const total = data.total ?? data.count ?? (Array.isArray(items)?items.length:0);
  const norm = items.map(normalizeItem);

  // capture genera facet opportunistically
  state.generaFacet = dedupe([...(state.generaFacet || []), ...norm.map(i=>i.genus)]);
  return {items:norm, total};
}

/* ---------- Render ---------- */
function render(items){
  const g = $('#gallery');
  g.innerHTML = items.map(it=>{
    const alt = (it.display_name || `${it.genus||""} ${it.species||""}`).trim() || 'Orchid';
    return `<article class="card" role="listitem">
      <img class="thumb" loading="lazy" src="${ihtml(it.img_url)}" alt="${ihtml(alt)}">
      <div class="cap">${caption(it)}</div>
    </article>`;
  }).join('');

  state.lastItems = items;
  if(state.mapOn) drawMap(items);
}
function counters(){
  const totalPages = Math.max(1, Math.ceil(state.total / state.pageSize));
  const page = Math.floor(state.offset / state.pageSize) + 1;
  $('#pageInfo').textContent = `${page} / ${totalPages}`;
  $('#count').textContent = `${state.total} result${state.total===1?'':'s'}`;
}

/* ---------- Map ---------- */
function toggleMap(on){
  state.mapOn = !!on;
  $('#mapwrap').classList.toggle('active', state.mapOn);
  const btn = $('#mapToggle');
  btn.setAttribute('aria-pressed', state.mapOn ? 'true' : 'false');
  btn.textContent = state.mapOn ? 'Map: On' : 'Map: Off';
  if(state.mapOn) drawMap(state.lastItems||[]);
}
function drawMap(items){
  const canvas = $('#mapCanvas'); if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.fillStyle='#eef6ff'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#dbeafe'; ctx.lineWidth=1;
  for(let lon=-180; lon<=180; lon+=60){ const x=((lon+180)/360)*W; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let lat=-60; lat<=60; lat+=30){ const y=((90-lat)/180)*H; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  for(const it of items){
    if(typeof it.lat!=='number' || typeof it.lng!=='number') continue;
    const x=((it.lng+180)/360)*W, y=((90-it.lat)/180)*H;
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle='rgba(30,64,175,.85)'; ctx.fill();
    ctx.lineWidth=1; ctx.strokeStyle='rgba(30,58,138,.6)'; ctx.stroke();
  }
}

/* ---------- Rotation & Flow ---------- */
function startRotate(){
  if(state.rotateTimer || !state.rotateDefault || state.total<=state.pageSize) return;
  state.rotateTimer = setInterval(()=>{ if(!state.motionPaused) nextPage(true); }, state.rotateInterval);
  $('#rotate').setAttribute('aria-pressed','true');
}
function stopRotate(){
  if(state.rotateTimer){ clearInterval(state.rotateTimer); state.rotateTimer=null; }
  $('#rotate').setAttribute('aria-pressed','false');
}

async function fetchRender(offset, fade=true){
  state.offset = offset;
  if(fade) $('#gallery').classList.add('gallery--fade');
  const {items,total} = await fetchOrchids({offset: state.offset, limit: state.pageSize});
  state.total = total;
  // populate genera select first time
  if(!$('#genus').options.length) populateControls();
  render(items);
  counters();
  stopRotate();
  if(state.rotateDefault && state.total>state.pageSize) startRotate();
  setTimeout(()=>$('#gallery').classList.remove('gallery--fade'), 40);
}

async function applyFilters(){
  state.filters.country = $('#country').value || "";
  state.filters.genus = Array.from($('#genus').selectedOptions).map(o=>o.value);
  state.filters.temp = $('#temp').value || "";
  const minE = parseInt($('#minElev').value||'',10);
  const maxE = parseInt($('#maxElev').value||'',10);
  state.filters.min_elev = Number.isFinite(minE)?minE:undefined;
  state.filters.max_elev = Number.isFinite(maxE)?maxE:undefined;
  await fetchRender(0,true);
}
async function resetFilters(){
  state.filters = { country:"", genus:[], temp:"", min_elev:undefined, max_elev:undefined };
  populateControls();
  await fetchRender(0,true);
}
async function prevPage(fade=true){
  const next = Math.max(0, state.offset - state.pageSize);
  await fetchRender(next, fade);
}
async function nextPage(fade=true){
  const next = (state.offset + state.pageSize) >= state.total ? 0 : (state.offset + state.pageSize);
  await fetchRender(next, fade);
}

/* ---------- Legend integration (iframe postMessage) ---------- */
window.addEventListener('message', async (event)=>{
  const msg = event?.data;
  if(!msg || msg.type !== 'fcos-legend-filter') return;
  const { facet, value, active } = msg.detail || {};
  if(facet === 'clear_all'){
    await resetFilters(); return;
  }
  if(facet === 'temperature_class' && active){
    state.filters.temp = value || "";
    $('#temp').value = state.filters.temp || "";
    await fetchRender(0,true);
  }
  if(facet === 'light' && active){
    // (Optional) map light -> a note; skip unless you model light in API
  }
  if(facet === 'fragrance' && active){
    // (Optional) add fragrance filter if your API supports it
  }
});

/* ---------- Events ---------- */
$('#motion').addEventListener('click',()=>{
  state.motionPaused = !state.motionPaused;
  $('#motion').textContent = state.motionPaused ? 'Resume' : 'Pause';
  $('#title').style.animationPlayState = state.motionPaused ? 'paused' : 'running';
  if(state.motionPaused) stopRotate(); else startRotate();
});
$('#titlebar').addEventListener('mouseenter',()=>{ $('#title').style.animationPlayState='paused'; });
$('#titlebar').addEventListener('mouseleave',()=>{ if(!state.motionPaused) $('#title').style.animationPlayState='running'; });

$('#apply').addEventListener('click', applyFilters);
$('#clear').addEventListener('click', resetFilters);
$('#prev').addEventListener('click', ()=>prevPage(true));
$('#next').addEventListener('click', ()=>nextPage(true));
$('#rotate').addEventListener('click', ()=>{
  if(state.rotateTimer){ stopRotate(); state.rotateDefault=false; }
  else { state.rotateDefault=true; startRotate(); }
});
$('#mapToggle').addEventListener('click', ()=> toggleMap(!state.mapOn));

/* ---------- Start ---------- */
applyURL();
populateControls();
fetchRender(0,false);
</script>
</body>
</html>
