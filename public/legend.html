<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FCOS Orchid Legend</title>
<style>
  :root{
    --bg: #ffffff; --fg:#0f172a; --muted:#64748b; --card:#f8fafc; --line:#e5e7eb;
    --accent:#1d4ed8; --accent-2:#0ea5e9; --warn:#f59e0b; --ok:#16a34a; --rose:#e11d48;
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1020; --fg:#e6edf3; --muted:#9aa7b3; --card:#10172a; --line:#243046; }
  }

  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:14px}
  .legend{display:grid;gap:12px}
  .group{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:10px}
  .group h2{margin:0 0 8px 0;font-size:14px;letter-spacing:.02em}
  .icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;outline:none;cursor:pointer}
  .item:focus-visible{box-shadow:0 0 0 3px rgba(29,78,216,.35)}
  .item[aria-pressed="true"]{border-color:var(--accent)}
  .svg{width:28px;height:28px;flex:0 0 28px}
  .label{font-weight:600;font-size:13px}
  .note{font-size:12px;color:var(--muted)}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
  .bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 2px 0}
  .bar .muted{font-size:12px;color:var(--muted)}
  .btn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
  .btn:hover{background:var(--card)}
  .muted{color:var(--muted)}
  /* reduce motion */
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap" id="legendRoot" aria-label="Orchid icon legend">
  <div class="bar">
    <div class="muted">Tap an icon to filter (emits <code>fcos-legend-filter</code>)</div>
    <button class="btn" id="clearBtn" type="button" title="Clear selection">Clear</button>
  </div>

  <section class="legend">
    <!-- Fragrance -->
    <div class="group" data-group="fragrance">
      <h2>Fragrance</h2>
      <div class="icons">
        <button class="item" data-filter='{"facet":"fragrance","value":"fragrant"}' title="Fragrant">
          <svg class="svg" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M7 3c2 1 2 3 0 4 2 1 2 3 0 4m5-8c2 1 2 3 0 4 2 1 2 3 0 4m5-8c2 1 2 3 0 4 2 1 2 3 0 4" />
            <circle cx="12" cy="17" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
          <div>
            <div class="label">Fragrant</div>
            <div class="note">Species noted for perfume/scent</div>
          </div>
        </button>
      </div>
    </div>

    <!-- Light -->
    <div class="group" data-group="light">
      <h2>Light</h2>
      <div class="icons">
        <button class="item" data-filter='{"facet":"light","value":"full_shade"}' title="Full shade">
          <svg class="svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
          <div><div class="label">Full shade</div><div class="note">Low light</div></div>
        </button>
        <button class="item" data-filter='{"facet":"light","value":"partial_shade"}' title="Dappled/Partial shade">
          <svg class="svg" viewBox="0 0 24 24">
            <defs><linearGradient id="g1"><stop offset="50%" /><stop offset="50%" stop-color="transparent"/></linearGradient></defs>
            <circle cx="12" cy="12" r="9" fill="url(#g1)" stroke="currentColor"/>
          </svg>
          <div><div class="label">Partial shade</div><div class="note">Dappled light</div></div>
        </button>
        <button class="item" data-filter='{"facet":"light","value":"bright_light"}' title="Bright / Full light">
          <svg class="svg" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="2">
              <path d="M12 1v4M12 19v4M1 12h4M19 12h4M4.2 4.2l2.8 2.8M17 17l3 3M4.2 19.8l2.8-2.8M17 7l3-3"/>
            </g>
          </svg>
          <div><div class="label">Bright light</div><div class="note">High but indirect</div></div>
        </button>
        <button class="item" data-filter='{"facet":"light","value":"full_sun"}' title="Full sun">
          <svg class="svg" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="2">
              <path d="M12 0v5M12 19v5M0 12h5M19 12h5M3 3l3.5 3.5M17.5 17.5L21 21M3 21l3.5-3.5M17.5 6.5L21 3"/>
            </g>
          </svg>
          <div><div class="label">Full sun</div><div class="note">Direct sun tolerant</div></div>
        </button>
      </div>
    </div>

    <!-- Temperature -->
    <div class="group" data-group="temperature">
      <h2>Temperature (night avg.)</h2>
      <div class="icons">
        <button class="item" data-filter='{"facet":"temperature_class","value":"cold"}' title="Cold: ≥2500 m / 50–58°F">
          <svg class="svg" viewBox="0 0 24 24">
            <rect x="9" y="3" width="6" height="14" rx="3" stroke="currentColor" fill="none"/>
            <path d="M12 17v4" stroke="currentColor" stroke-width="2"/>
          </svg>
          <div><div class="label">Cold</div><div class="note">≈ ≥2500 m • 50–58°F</div></div>
        </button>
        <button class="item" data-filter='{"facet":"temperature_class","value":"cool"}' title="Cool: 1800–2500 m / 58–66°F">
          <svg class="svg" viewBox="0 0 24 24">
            <rect x="9" y="3" width="6" height="14" rx="3" stroke="currentColor" fill="none"/>
            <circle cx="12" cy="18.5" r="2.5" fill="currentColor"/>
          </svg>
          <div><div class="label">Cool</div><div class="note">≈ 1800–2500 m • 58–66°F</div></div>
        </button>
        <button class="item" data-filter='{"facet":"temperature_class","value":"intermediate"}' title="Intermediate: 1000–1800 m / 66–75°F">
          <svg class="svg" viewBox="0 0 24 24">
            <rect x="9" y="3" width="6" height="14" rx="3" stroke="currentColor" fill="none"/>
            <path d="M12 16a3 3 0 1 0 0 .01" fill="currentColor"/>
          </svg>
          <div><div class="label">Intermediate</div><div class="note">≈ 1000–1800 m • 66–75°F</div></div>
        </button>
        <button class="item" data-filter='{"facet":"temperature_class","value":"warm"}' title="Warm: Sea level–1000 m / 75–85°F">
          <svg class="svg" viewBox="0 0 24 24">
            <rect x="9" y="3" width="6" height="14" rx="3" stroke="currentColor" fill="none"/>
            <path d="M12 15a4 4 0 1 0 0 .01" fill="currentColor"/>
          </svg>
          <div><div class="label">Warm</div><div class="note">≈ 0–1000 m • 75–85°F</div></div>
        </button>
        <button class="item" data-filter='{"facet":"temperature_class","value":"hot"}' title="Hot: (rarely used; very warm)">
          <svg class="svg" viewBox="0 0 24 24">
            <rect x="9" y="3" width="6" height="14" rx="3" stroke="currentColor" fill="none"/>
            <path d="M12 14a5 5 0 1 0 0 .01" fill="currentColor"/>
          </svg>
          <div><div class="label">Hot</div><div class="note">Very warm conditions</div></div>
        </button>
      </div>
    </div>

    <!-- Seasons -->
    <div class="group" data-group="season">
      <h2>Season Icons</h2>
      <div class="icons">
        <button class="item" data-filter='{"facet":"season","value":"spring"}' title="Spring">
          <svg class="svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.2 5.2L20 8l-4 3.6.9 5.4-4.9-2.7-4.9 2.7.9-5.4L4 8l5.8-.8z"/></svg>
          <div><div class="label">Spring</div><div class="note">Typical bloom season</div></div>
        </button>
        <button class="item" data-filter='{"facet":"season","value":"summer"}' title="Summer">
          <svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>
          <div><div class="label">Summer</div><div class="note"></div></div>
        </button>
        <button class="item" data-filter='{"facet":"season","value":"fall"}' title="Fall">
          <svg class="svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c4 4 4 8 0 12-4-4-4-8 0-12z"/></svg>
          <div><div class="label">Fall</div><div class="note"></div></div>
        </button>
        <button class="item" data-filter='{"facet":"season","value":"winter"}' title="Winter">
          <svg class="svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19"/></svg>
          <div><div class="label">Winter</div><div class="note"></div></div>
        </button>
      </div>
    </div>

    <!-- Size -->
    <div class="group" data-group="size">
      <h2>Plant Size</h2>
      <div class="icons">
        <button class="item" data-filter='{"facet":"size","value":"mini"}' title="Miniature: &lt; 6 in">
          <svg class="svg" viewBox="0 0 24 24"><rect x="6" y="10" width="6" height="8" rx="2" fill="currentColor"/></svg>
          <div><div class="label">Miniature</div><div class="note">&lt; 6&quot;</div></div>
        </button>
        <button class="item" data-filter='{"facet":"size","value":"small"}' title="Small: &lt; 12 in">
          <svg class="svg" viewBox="0 0 24 24"><rect x="6" y="9" width="8" height="9" rx="2" fill="currentColor"/></svg>
          <div><div class="label">Small</div><div class="note">&lt; 12&quot;</div></div>
        </button>
        <button class="item" data-filter='{"facet":"size","value":"medium"}' title="Medium: &lt; 24 in">
          <svg class="svg" viewBox="0 0 24 24"><rect x="5" y="7" width="10" height="11" rx="2" fill="currentColor"/></svg>
          <div><div class="label">Medium</div><div class="note">&lt; 24&quot;</div></div>
        </button>
        <button class="item" data-filter='{"facet":"size","value":"large"}' title="Large: &lt; 48 in">
          <svg class="svg" viewBox="0 0 24 24"><rect x="4" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          <div><div class="label">Large</div><div class="note">&lt; 48&quot;</div></div>
        </button>
        <button class="item" data-filter='{"facet":"size","value":"giant"}' title="Giant: ≥ 48 in">
          <svg class="svg" viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="14" rx="2" fill="currentColor"/></svg>
          <div><div class="label">Giant</div><div class="note">≥ 48&quot;</div></div>
        </button>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  const root = document.getElementById('legendRoot');
  const clearBtn = document.getElementById('clearBtn');

  // Toggle & emit custom event for parent pages (same document)
  function activate(btn){
    const pressed = btn.getAttribute('aria-pressed') === 'true';
    // single-select within a group
    const group = btn.closest('.group');
    group.querySelectorAll('.item[aria-pressed="true"]').forEach(b=>b.setAttribute('aria-pressed','false'));
    if(!pressed) btn.setAttribute('aria-pressed','true');

    const data = JSON.parse(btn.dataset.filter || "{}");
    const detail = { ...data, active: !pressed };
    root.dispatchEvent(new CustomEvent('fcos-legend-filter', { bubbles:true, detail }));

    // Also postMessage for iframe embedding
    try{
      parent.postMessage({ type:'fcos-legend-filter', detail }, '*');
    }catch(e){}
  }

  root.addEventListener('click', e=>{
    const btn = e.target.closest('.item');
    if(btn) activate(btn);
  });
  root.addEventListener('keydown', e=>{
    if((e.key==='Enter'||e.key===' ') && e.target.closest('.item')){
      e.preventDefault();
      activate(e.target.closest('.item'));
    }
  });

  clearBtn.addEventListener('click', ()=>{
    root.querySelectorAll('.item[aria-pressed="true"]').forEach(b=>b.setAttribute('aria-pressed','false'));
    const detail = { facet:'clear_all', value:null, active:false };
    root.dispatchEvent(new CustomEvent('fcos-legend-filter', { bubbles:true, detail }));
    try{ parent.postMessage({ type:'fcos-legend-filter', detail }, '*'); }catch(e){}
  });

  // Accessibility init
  root.querySelectorAll('.item').forEach(b=>{
    b.setAttribute('role','button');
    b.setAttribute('tabindex','0');
    b.setAttribute('aria-pressed','false');
  });
})();
</script>
</body>
</html>
